          - generic [ref=f2e67]:
            - heading "六个设计概念" [level=2] [ref=f2e68]
            - paragraph [ref=f2e69]: 整套 plugin 的行为都从这六条推导出来。看懂这六条,后面每一步的设计都不意外。
            - generic [ref=f2e70]:
              - generic [ref=f2e71]:
                - heading "两态一门" [level=3] [ref=f2e72]
                - paragraph [ref=f2e73]: 想清楚之前是螺旋:调查、方案、设计、原型之间随便回头,改主意不受罚。想清楚之后是流水线:单向推进、产物明确、机器可验。两态之间只有一道门——你确认设计。门之前 plugin 帮你想,门之后 plugin 帮你做。
              - generic [ref=f2e74]:
                - heading "快速、确定性、token 经济" [level=3] [ref=f2e75]
                - paragraph [ref=f2e76]: 流程行为尽量脚本化一次算完:下一步是什么、命令怎么拼、产物落哪,引擎直接吐确切答案,agent 不在流程上做思考和决策。长内容(findings、证据、进度)压在盘上文件里,主线程只回读结论段;派发 prompt 只点名 skill,不复述方法论。省下来的注意力全部花在设计沟通和落地 review 上。
              - generic [ref=f2e77]:
                - heading "脚本是书记员和工长,不是法官" [level=3] [ref=f2e78]
                - paragraph [ref=f2e79]: 讨论态里脚本当书记员:记书签、渲染进度、落盘产物。流水线态里当工长:建 worktree、派工人、拼派发指令。它在任何一态都不否决判断:审得够不够、要不要回头、要不要问人,永远是 agent 和你的事,脚本只记录和提醒。
              - generic [ref=f2e80]:
                - heading "机器否决权白名单" [level=3] [ref=f2e81]
                - paragraph [ref=f2e82]: 脚本只在四种机器可核验的事实上说不:①出站动作(push / PR 合并 / 部署)必须你亲批;②审者和写者不能是同一个;③状态过期(版本或时效对不上)必须先重新对表;④设计确认时的文档指纹,防「确认的是 A、拿去执行的是 B」。白名单之外一律放行。
              - generic [ref=f2e83]:
                - heading "状态是书签,不是判决书" [level=3] [ref=f2e84]
                - paragraph [ref=f2e85]: task.json 记录你们走到哪、确认过什么、还有什么待拍板,带版本戳和时间戳,还存着你的需求原文(建任务时逐字钉入,范围变更时刷新)和等你答的问题(缺输入停下时落盘)。重开 CLI 时它把你们送回上次的位置;它陈旧时 plugin 先报龄、先对表,绝不把旧状态断言成当前真相。
              - generic [ref=f2e86]:
                - heading "该问的时候能问,该跑的时候不吵" [level=3] [ref=f2e87]
                - paragraph [ref=f2e88]: 讨论态天生 attended,agent 可以问你、必须跟你对齐。过门自动切 afk:小事自决留痕、大事(缺输入 / 方向存疑 / 出站)才来找你。你人回来说话,提问能力立即恢复——两个宿主都一样,不存在「回来了它还闷头跑」。

            - heading "新版 plugin 是怎么跑的" [level=1] [ref=f2e35]
            - paragraph [ref=f2e36]: 一个开发任务在这套 plugin 里经历两种状态:先在讨论态里和你把事情想清楚(可中断、可重入、可反复),跨过一道人闸(你确认设计),然后进入流水线态自主把定案做出来(切片、计划、写码、终审)。脚本全程只做两件事:代劳机械活、记录发生了什么;它不评判你和 agent 的判断。确定性的活脚本一次算完,agent 的思考和 token 只花在两个刀刃上:设计沟通迭代,和计划落地 review。
            - paragraph [ref=f2e37]: "全流程一眼看完:"

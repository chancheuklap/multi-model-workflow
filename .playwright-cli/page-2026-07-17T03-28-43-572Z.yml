                      - listitem [ref=f2e399]: plugin 测试写作权威(工人作业本自带,「测试该怎么写」的唯一来源):断言只认外部可观察事实(系统读接口 > HTTP 响应 > 文件产物 > 账本行);mock 只在外部供应商接缝、自家模块间禁 mock;每行为在权威层测一次;测试数据走真实 producer 路径;生产代码禁为测试留后门;回归测试进业务域文件;外加一张禁止形态清单(grep 源码断言、逐字锁文案、字段镜像、文档计数、墓碑清单、meta-gate 一律不许写)和准入问题——「这个测试守的是哪个用户旅程/哪笔钱/哪份数据?答不出就没资格进仓」;
                      - listitem [ref=f2e400]: 仓库薄层(各仓库 TESTING.md 只写本仓库事实,不写方法论):测试目录分层表、本仓库哪些边界算外部可 mock、价格/文案从哪个权威源读、套件入口与门控。派发脚本定位薄层写进工人 prompt;仓库没有薄层照样能写对——方法论在身上,落点随仓库惯例,回执注明;

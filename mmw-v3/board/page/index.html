<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="mmw-page-token" content="__MMW_PAGE_TOKEN__">
    <title>MMW task board</title>
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/board.css">
    <link rel="stylesheet" href="./styles/topbar.css">
    <link rel="stylesheet" href="./styles/tasks.css">
    <link rel="stylesheet" href="./styles/canvas.css">
    <link rel="stylesheet" href="./styles/detail.css">
    <link rel="stylesheet" href="./styles/settings.css">
    <style>
      html, body { margin: 0; height: 100%; background: var(--desk); }
    </style>
  </head>
  <body>
    <main class="app-shell board" data-screen="board" data-board-root data-ui="任务板.root">
      <div class="app-top" data-mount="topbar"></div>
      <div class="app-row">
        <div class="app-slot" data-mount="tasks"></div>
        <div class="app-slot" data-mount="canvas"></div>
        <div class="app-slot" data-mount="detail"></div>
      </div>
      <div class="app-sheet" data-mount="settings"></div>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>

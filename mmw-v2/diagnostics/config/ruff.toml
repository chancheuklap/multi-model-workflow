# ruff 的规则，五个宿主、所有仓库共用这一份。
#
# check.py 用 --config 把这个路径传给 ruff，所以被检查的仓库里有没有自己的 ruff 配置
# 都不影响判定。上一代是往每个仓库的 pyproject.toml 里写一份，那些副本会各自漂移。
#
# 规则集写死，不跟随 ruff 的默认值。默认值随版本变：2026-08-10 实测同一份代码，
# ruff 0.15 报 727 条、0.16 报 4782 条，差的全是默认集合的漂移。写死之后升级 ruff
# 不会一夜之间多出几千条。加规则族的时候一次加一族，把存量清掉再加下一族。

[lint]
select = ["E4", "E7", "E9", "F"]

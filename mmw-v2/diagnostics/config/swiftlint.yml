# swiftlint 的规则。跟 ruff 那份同一条思路：只留判定「这段代码错了」的规则，
# 不留判定「这段代码不好看」的。
#
# swiftlint 默认开 100 多条，里面混着大量命名与排版规则——identifier_name 会因为
# `let x` 报错，line_length 会因为一行长了报错。编辑后诊断报的是 agent 刚写的几行，
# 混进排版意见就没人看了。
#
# only_rules 是白名单：写在这里的开，其余一概关。名单来源是 swiftlint 自己
# `swiftlint rules` 里 kind=lint 且默认开启的那一批（真错误），加 force_cast 与
# force_try（默认开启，kind=idiomatic，但它们是崩溃风险，属于真错误）。
#
# 刻意不收的几条默认规则：
#   todo                        TODO 注释不是错误，会一直响
#   mark / comment_spacing      排版
#   deployment_target           跟具体工程的部署目标绑定，我们这份配置是通用的
#   blanket_disable_command     这三条管的是 swiftlint 自己的 // swiftlint:disable
#   invalid_swiftlint_command   指令。我们带自己的配置进来，仓库里针对它自己那套
#   superfluous_disable_command 规则写的 disable 在这里全成了「多余」，会全部误报

only_rules:
  - class_delegate_protocol
  - compiler_protocol_init
  - discouraged_direct_init
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicated_key_in_dictionary_literal
  - dynamic_inline
  - force_cast
  - force_try
  - invisible_character
  - non_optional_string_data_conversion
  - notification_center_detachment
  - ns_number_init_as_function_reference
  - nsobject_prefer_isequal
  - optional_data_string_conversion
  - orphaned_doc_comment
  - private_unit_test
  - redundant_sendable
  - self_in_property_initialization
  - unneeded_override
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_optional_binding
  - unused_setter_value
  - valid_ibinspectable

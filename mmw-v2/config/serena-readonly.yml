# Serena 的只读工具白名单，五个宿主共用这一份。
#
# 为什么白名单做在服务器这一侧，不只做在宿主那一侧：宿主的工具过滤策略各不相同，
# 也随时可能被用户改动。上游默认暴露的工具里有任意命令执行、创建覆写文件、在符号
# 前后插入代码、重命名与删除符号，还有一套往仓库落文件的记忆系统。fixed_tools 让
# Serena 进程自己只注册下面四个，任何客户端连上来看到的都一样。
#
# 改这份文件之前先想清楚：多放进来一个工具，每个宿主的每个 agent 立刻都拿得到。
#
# 下面的 prompt 必须存在但**不要**往里写使用纪律，两件事都是实测出来的：
#
#   必须存在：SerenaAgentContext 把它列为必填，删掉这一行 serena 直接起不来
#             （TypeError: missing 1 required keyword-only argument: 'prompt'）。
#   写了也白写：serena 的 MCP 服务器说明取自 connection_prompt 模板，不取自这里。
#             握手实测下发的逐字是前者。context 的 prompt 走项目激活那条路，
#             写在这里的文字任何 agent 都看不见。
#
# 说明正文在 config/serena-connection-prompt.yml，由 install-mcp.sh 装到
# ~/.serena/prompt_templates/connection_prompt.yml。改说明改那一份。
description: MMW read-only symbol retrieval
prompt: ""
fixed_tools:
  - find_symbol
  - find_referencing_symbols
  - get_symbols_overview
  - find_implementations
single_project: true
structured_tool_output: true

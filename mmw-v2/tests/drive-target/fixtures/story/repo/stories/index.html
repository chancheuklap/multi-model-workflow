<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; }
      .demo {
        width: 320px;
        height: 200px;
        box-sizing: border-box;
        padding: 16px;
        background: #f4f1ec;
        font: 16px/24px sans-serif;
        color: #1a1a1a;
      }
      .swatch { width: 80px; height: 80px; background: #2f6fed; }
      h1 { margin: 0 0 8px; font-size: 20px; line-height: 24px; font-weight: 700; }
      p { margin: 0 0 12px; }
      button { margin: 0; padding: 4px 8px; font: 14px/20px sans-serif; }
    </style>
  </head>
  <body>
    <div data-story-root class="demo" data-screen="demo"></div>
    <script>
      const COPY = {
        alpha: "Alpha scene copy",
        beta: "Beta scene copy",
        gamma: "Gamma scene copy"
      };
      const params = new URLSearchParams(location.search);
      const scene = params.get("scene") || "";
      const root = document.querySelector("[data-story-root]");
      root.innerHTML =
        "<h1>Demo card</h1>" +
        "<p>" + (COPY[scene] || "") + "</p>" +
        '<div class="swatch" aria-hidden="true"></div>' +
        '<button type="button">Continue</button>';
    </script>
  </body>
</html>

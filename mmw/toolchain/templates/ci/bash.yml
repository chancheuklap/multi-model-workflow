name: mmw-bash

# 由 mmw toolchain apply 产出，MMW 拥有这份文件。改判据要改 MMW 的模板
# （toolchain/templates/ci/bash.yml）——只改这一份，换个仓库就没有了，而且下一次
# apply 会把它盖回去。
#
# 检查器和本地编辑后诊断（mmw toolchain check）是同一个：shellcheck，同样的 gcc 输出格式。
#
# 两种模式：
#   - PR / push：只查本次改动的文件。仓库通常有存量问题，整仓当门会一直红，红久了就
#     没人看了；只查改动 = 不被存量误红，又挡得住新引入的问题。
#   - 手动 workflow_dispatch：全仓审计，用于专门清存量。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmw-bash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    name: mmw-bash-changed
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          # 三点 diff（merge-base...HEAD）：只取本分支引入的改动，不混入 main 侧独立改的文件。
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "${BASE_REF}...${HEAD_REF}" -- '*.sh' '*.bash' || true)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "无改动的 shell 脚本，跳过。"
            exit 0
          fi
          printf '将检查：\n'; printf '  %s\n' "${changed[@]}"
          shellcheck --format gcc "${changed[@]}"

  full:
    name: mmw-bash-full
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # 基线未收口前，失败只说明存量问题仍在。
      - name: Shellcheck baseline audit
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t all < <(git ls-files '*.sh' '*.bash')
          if [ "${#all[@]}" -eq 0 ]; then
            echo "没有 shell 脚本。"
            exit 0
          fi
          shellcheck --format gcc "${all[@]}"

<!-- @dsCard group="Spacing" viewport="700x110" name="Radius" subtitle="Cards 10px, the sheet 12px, buttons and fields 6–8px, pills and lamps round" -->
<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
html, body { margin: 0; background: var(--panel); }
.g-row { display: flex; gap: 12px; padding: 16px; flex-wrap: wrap; align-items: flex-end; }
.g-sw { width: 96px; font: 10px var(--mono); color: var(--muted); }
.g-chip { height: 48px; border-radius: 8px; border: 1px solid var(--rule); margin-bottom: 6px; }
.g-line { padding: 4px 16px; }
</style>
</head>
<body class="board">
<div class="g-row"><div class="g-sw"><div class="g-chip" style="border-radius:10px;background:var(--canvas)"></div>card 10</div><div class="g-sw"><div class="g-chip" style="border-radius:12px;background:var(--canvas)"></div>sheet 12</div><div class="g-sw"><div class="g-chip" style="border-radius:7px;background:var(--canvas)"></div>button 7</div><div class="g-sw"><div class="g-chip" style="border-radius:24px;background:var(--canvas)"></div>pill</div></div>
</body>
</html>

<!-- @dsCard group="Spacing" viewport="700x130" name="Padding" subtitle="Columns 18–24px across; sections split by a rule with 12–16px above" -->
<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
html, body { margin: 0; background: var(--panel); }
.g-row { display: flex; gap: 12px; padding: 16px; flex-wrap: wrap; align-items: flex-end; }
.g-sw { width: 96px; font: 10px var(--mono); color: var(--muted); }
.g-chip { height: 48px; border-radius: 8px; border: 1px solid var(--rule); margin-bottom: 6px; }
.g-line { padding: 4px 16px; }
</style>
</head>
<body class="board">
<div style="padding:16px"><div style="border:1px dashed var(--line-grey);padding:18px 22px;font:10px var(--mono);color:var(--muted)">detail column · 18px 22px<div style="border-top:1px solid var(--rule-2);margin-top:14px;padding-top:14px">section · rule + 14px</div></div></div>
</body>
</html>

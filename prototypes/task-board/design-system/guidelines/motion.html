<!-- @dsCard group="Brand" viewport="700x110" name="Motion" subtitle="Only the green beam on a running blocking line moves; reduced motion draws it still" -->
<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
html, body { margin: 0; background: var(--panel); }
.g-row { display: flex; gap: 12px; padding: 16px; flex-wrap: wrap; align-items: flex-end; }
.g-sw { width: 96px; font: 10px var(--mono); color: var(--muted); }
.g-chip { height: 48px; border-radius: 8px; border: 1px solid var(--rule); margin-bottom: 6px; }
.g-line { padding: 4px 16px; }
</style>
</head>
<body class="board">
<div class="g-row"><span class="legend-item" style="font:10px var(--mono);color:var(--soft)"><span class="legend-line flow"></span>released · working (beam)</span><span class="legend-item" style="font:10px var(--mono);color:var(--soft)"><span class="legend-line"></span>walked</span><span class="legend-item" style="font:10px var(--mono);color:var(--soft)"><span class="legend-line blocked"></span>blocked</span></div>
</body>
</html>

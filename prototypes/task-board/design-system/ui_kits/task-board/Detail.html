<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<title>MMW task board — 详情</title>
<link rel="stylesheet" href="../../styles.css" />
<style>html, body { margin: 0; background: #e6e3df; }</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<body>
<div id="root" style="width:340px;height:848px;position:relative;overflow:hidden"></div>
<script type="text/babel">
const S = window.TaskBoardScreens;
const scene = window.BOARD_SCENES.morning;
const task = scene.payload.tasks.find(t => t.n === scene.select.task);
S.mount(<div style={{height: 848}}><S.Detail payload={scene.payload} sel={scene.select.node} /></div>);
</script>
</body>

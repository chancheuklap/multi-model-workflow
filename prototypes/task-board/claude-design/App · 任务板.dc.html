<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="stylesheet" href="./_ds/mmw-task-board-2-34b69870-86b7-4125-a104-b9560bcf3956/styles.css" />
        <script src="./_ds/mmw-task-board-2-34b69870-86b7-4125-a104-b9560bcf3956/_ds_bundle.js"></script>
        <script src="./lib/board.js"></script>
        <script src="./data/board-morning.js"></script>
        <script src="./data/board-twenty-tickets.js"></script>
        <script src="./data/board-bad-data.js"></script>
        <script src="./data/board-empty.js"></script>
        <script src="./data/settings.js"></script>
      </helmet>
      <main class="app-shell board" data-screen-label="任务板" style="{{ shellStyle }}">
        <div class="app-top">
          <dc-import name="Component · 顶栏" scene="{{ scene }}" settingsOpen="{{ settingsOpen }}" onJumpNeedYou="{{ jump }}" onOpenSettings="{{ openSettings }}" hint-size="1440px,52px"></dc-import>
        </div>
        <div class="app-slot">
          <dc-import name="Component · 任务列表" scene="{{ scene }}" task="{{ task }}" onSelectTask="{{ pickTask }}" hint-size="236px,848px"></dc-import>
        </div>
        <div class="app-slot">
          <dc-import name="Component · 画布" scene="{{ scene }}" task="{{ task }}" sel="{{ sel }}" width="{{ canvasWidth }}" height="{{ 848 }}" onSelectNode="{{ pickNode }}" hint-size="100%,848px"></dc-import>
        </div>
        <sc-if value="{{ hasDetail }}" hint-placeholder-val="{{ true }}">
          <div class="app-slot">
            <dc-import name="Component · 详情" scene="{{ scene }}" sel="{{ sel }}" onGoto="{{ gotoNode }}" onClose="{{ closeDetail }}" hint-size="340px,848px"></dc-import>
          </div>
        </sc-if>
        <div class="app-sheet" style="{{ sheetStyle }}">
          <sc-if value="{{ settingsOpen }}" hint-placeholder-val="{{ false }}">
            <dc-import name="Component · 本机配置" scene="mine" onClose="{{ closeSettings }}" hint-size="1440px,900px"></dc-import>
          </sc-if>
        </div>
      </main>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{
  "$preview": { "width": 1440, "height": 900 },
  "scene": { "editor": "enum", "options": ["morning", "twenty-tickets", "bad-data", "empty"], "default": "morning" }
}'>
      class Component extends DCLogic {
        componentDidMount() {
          const wait = () => {
            if (window.MMW && window.BOARD_SCENES && window.BOARD_SCENES.empty && window.SETTINGS_SCENES) this.forceUpdate();
            else setTimeout(wait, 20);
          };
          wait();
        }
        renderVals() {
          const key = this.props.scene || "morning";
          const data = window.BOARD_SCENES && window.BOARD_SCENES[key];
          const st = this.state && this.state.for === key ? this.state : {};
          const tasks = data ? data.payload.tasks || [] : [];
          const task = st.task !== undefined ? st.task
            : data && data.select.task != null ? data.select.task : (tasks[0] ? tasks[0].n : null);
          const sel = st.sel !== undefined ? st.sel : data && data.select.node != null ? data.select.node : null;
          const settingsOpen = Boolean(st.settingsOpen);
          const set = next => this.setState({task, sel, settingsOpen, ...next, for: key});
          const find = n => {
            for (const t of tasks) {
              if (t.n === n) return t.n;
              for (const d of t.decisions || []) if (d.n === n) return t.n;
              for (const sp of t.specs || []) {
                if (sp.n === n) return t.n;
                for (const tk of sp.tickets || []) if (tk.n === n) return t.n;
              }
            }
            return null;
          };
          const jump = () => {
            if (!window.MMW) return;
            const list = [];
            for (const t of tasks) for (const tk of window.MMW.Board.allTickets(t)) {
              if (window.MMW.Board.lamp(tk) === "orange") list.push({task: t.n, node: tk.n});
            }
            if (!list.length) return;
            const index = list.findIndex(item => item.node === sel);
            const next = list[(index + 1) % list.length];
            set({task: next.task, sel: next.node});
          };
          const hasDetail = sel != null;
          return {
            scene: key, task, sel, settingsOpen, hasDetail,
            canvasWidth: hasDetail ? 864 : 1204,
            shellStyle: {width: "1440px", height: "900px", gridTemplateColumns: hasDetail ? "236px minmax(0, 1fr) 340px" : "236px minmax(0, 1fr)"},
            sheetStyle: {pointerEvents: settingsOpen ? "auto" : "none"},
            jump,
            openSettings: () => set({settingsOpen: true}),
            closeSettings: () => set({settingsOpen: false}),
            pickTask: n => set({task: n, sel: null}),
            pickNode: n => set({sel: n}),
            gotoNode: n => { const t = find(n); if (t != null) set({task: t, sel: n}); },
            closeDetail: () => set({sel: null}),
          };
        }
      }
    </script>
  </body>
</html>

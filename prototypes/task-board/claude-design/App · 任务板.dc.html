<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/mmw-task-board-2-34b69870-86b7-4125-a104-b9560bcf3956/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/mmw-task-board-2-34b69870-86b7-4125-a104-b9560bcf3956/tokens/colors.css">
  <link rel="stylesheet" href="_ds/mmw-task-board-2-34b69870-86b7-4125-a104-b9560bcf3956/tokens/typography.css">
  <link rel="stylesheet" href="_ds/mmw-task-board-2-34b69870-86b7-4125-a104-b9560bcf3956/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/mmw-task-board-2-34b69870-86b7-4125-a104-b9560bcf3956/tokens/shape.css">
  <link rel="stylesheet" href="_ds/mmw-task-board-2-34b69870-86b7-4125-a104-b9560bcf3956/components/base.css">
  <link rel="stylesheet" href="_ds/mmw-task-board-2-34b69870-86b7-4125-a104-b9560bcf3956/styles.css">
  <script src="_ds/mmw-task-board-2-34b69870-86b7-4125-a104-b9560bcf3956/_ds_bundle.js"></script>
  <script src="data/app-scenes.js"></script>
  <style>body { margin: 0; background: var(--desk); }</style>
  <style>
    /* On the whole page each column fills the slot under the title bar, and the settings sheet lets the board show through. */
    [data-ui="任务列表.root"], [data-ui="画布.root"], [data-ui="详情.root"] { height: 100% !important; }
    [data-ui="本机配置.root"] { background: transparent !important; }
  </style>
</helmet>
<main class="board" data-ui="任务板.root" style="position: relative; height: 100vh; display: flex; flex-direction: column; background: var(--panel); overflow: hidden">
  <div style="flex: none">
    <dc-import name="Component · 顶栏" scene="{{ boardScene }}" settings-open="{{ settingsOpen }}" on-open-settings="{{ openSettings }}" on-jump-need-you="{{ jumpNeedYou }}" hint-size="100%,52px"></dc-import>
  </div>
  <div style="flex: 1; min-height: 0; display: flex; align-items: stretch">
    <div style="flex: none; width: 236px; min-width: 0; overflow: hidden">
      <dc-import name="Component · 任务列表" scene="{{ boardScene }}" selected="{{ task }}" on-select="{{ selectTask }}" hint-size="236px,100%"></dc-import>
    </div>
    <div style="flex: 1; min-width: 0; overflow: hidden">
      <dc-import name="Component · 画布" scene="{{ boardScene }}" tree="{{ tree }}" selected="{{ sel }}" on-select="{{ selectNode }}" hint-size="100%,100%"></dc-import>
    </div>
    <sc-if value="{{ hasDetail }}" hint-placeholder-val="{{ true }}">
      <div style="flex: none; width: 340px; min-width: 0; overflow: hidden">
        <dc-import name="Component · 详情" view="{{ detailView }}" on-close="{{ closeDetail }}" on-goto="{{ goTo }}" hint-size="340px,100%"></dc-import>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{ settingsOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 30">
      <dc-import name="Component · 本机配置" scene="{{ settingsScene }}" on-close="{{ closeSettings }}" hint-size="100%,100%"></dc-import>
    </div>
  </sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900}, &quot;scene&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;morning&quot;, &quot;twenty-tickets&quot;, &quot;bad-data&quot;, &quot;empty&quot;, &quot;nothing-selected&quot;, &quot;settings-open&quot;], &quot;default&quot;: &quot;morning&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = {task: undefined, sel: undefined, settingsOpen: undefined, ready: false};

  componentDidMount() { this.waitForData(); }

  waitForData(tries = 0) {
    if (window.APP_SCENES && window.APP_TREES && window.APP_DETAILS) { this.setState({ready: true}); return; }
    if (tries < 40) setTimeout(() => this.waitForData(tries + 1), 50);
  }

  componentDidUpdate(prev) {
    if (prev.scene !== this.props.scene) this.setState({task: undefined, sel: undefined, settingsOpen: undefined});
  }

  spec() {
    const scenes = (typeof window !== "undefined" && window.APP_SCENES) || {};
    return scenes[this.props.scene || "morning"] || {board: "empty", task: null, sel: null, settings: null};
  }

  trees() {
    const all = (typeof window !== "undefined" && window.APP_TREES) || {};
    return all[this.spec().board] || {};
  }

  details() {
    const all = (typeof window !== "undefined" && window.APP_DETAILS) || {};
    return all[this.spec().board] || {};
  }

  taskOf(n) { return this.trees()[String(n)] || null; }

  taskHolding(n) {
    for (const [taskN, tree] of Object.entries(this.trees())) {
      if (Number(taskN) === n) return Number(taskN);
      if ((tree.decisions || []).some(d => d.n === n)) return Number(taskN);
      for (const spec of tree.specs || []) {
        if (spec.n === n) return Number(taskN);
        if ((spec.tickets || []).some(t => t.n === n)) return Number(taskN);
      }
    }
    return null;
  }

  renderVals() {
    const spec = this.spec();
    const task = this.state.task === undefined ? spec.task : this.state.task;
    const sel = this.state.sel === undefined ? spec.sel : this.state.sel;
    const settingsOpen = this.state.settingsOpen === undefined
      ? Boolean(spec.settings) : this.state.settingsOpen;
    const tree = task == null ? null : this.taskOf(task);
    const detailView = sel == null ? null : this.details()[String(sel)] || null;

    const goTo = n => {
      const holder = this.taskHolding(n);
      if (holder == null) return;
      this.setState({task: holder, sel: n});
    };

    return {
      boardScene: spec.board,
      settingsScene: spec.settings || "mine",
      task, sel, tree,
      detailView,
      hasDetail: Boolean(detailView),
      settingsOpen,
      selectTask: n => this.setState({task: n, sel: null}),
      selectNode: n => this.setState({sel: n}),
      closeDetail: () => this.setState({sel: null}),
      openSettings: open => this.setState({settingsOpen: open}),
      closeSettings: () => this.setState({settingsOpen: false}),
      goTo,
      jumpNeedYou: () => {
        const list = [];
        for (const [taskN, item] of Object.entries(this.trees())) {
          for (const ticket of (item.specs || []).flatMap(s => s.tickets || [])) {
            if (ticket.lamp === "orange") list.push({task: Number(taskN), n: ticket.n});
          }
        }
        if (!list.length) return;
        const at = list.findIndex(item => item.n === sel);
        const next = list[(at + 1) % list.length];
        this.setState({task: next.task, sel: next.n});
      },
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="stylesheet" href="./_ds/mmw-task-board-2-34b69870-86b7-4125-a104-b9560bcf3956/styles.css" />
        <script src="./_ds/mmw-task-board-2-34b69870-86b7-4125-a104-b9560bcf3956/_ds_bundle.js"></script>
        <script src="./lib/board.js"></script>
        <script src="./data/board-morning.js"></script>
        <script src="./data/board-twenty-tickets.js"></script>
        <script src="./data/board-bad-data.js"></script>
        <script src="./data/board-empty.js"></script>
      </helmet>
      <header class="topbar board" data-screen-label="顶栏" style="{{ rootStyle }}">
        <x-import component-from-global-scope="MMWTaskBoard2_34b698.Brand" dc-props="{{ brand }}" hint-size="330px,20px"></x-import>
        <div class="counters">
          <x-import component-from-global-scope="MMWTaskBoard2_34b698.Counter" dc-props="{{ needYou }}" hint-size="110px,26px"></x-import>
          <x-import component-from-global-scope="MMWTaskBoard2_34b698.Counter" dc-props="{{ running }}" hint-size="180px,26px"></x-import>
          <x-import component-from-global-scope="MMWTaskBoard2_34b698.Counter" dc-props="{{ queued }}" hint-size="90px,26px"></x-import>
          <x-import component-from-global-scope="MMWTaskBoard2_34b698.Counter" dc-props="{{ done }}" hint-size="80px,26px"></x-import>
        </div>
        <x-import component-from-global-scope="MMWTaskBoard2_34b698.ReadState" dc-props="{{ read }}" hint-size="120px,20px"></x-import>
        <x-import component-from-global-scope="MMWTaskBoard2_34b698.IconButton" dc-props="{{ refresh }}" hint-size="30px,30px"></x-import>
        <x-import component-from-global-scope="MMWTaskBoard2_34b698.IconButton" dc-props="{{ settings }}" hint-size="30px,30px"></x-import>
      </header>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{
  "$preview": { "width": 1440, "height": 52 },
  "scene": { "editor": "enum", "options": ["morning", "twenty-tickets", "bad-data", "empty"], "default": "morning" },
  "settingsOpen": { "editor": "boolean", "default": false }
}'>
      class Component extends DCLogic {
        componentDidMount() {
          const wait = () => {
            if (window.MMW && window.MMWTaskBoard2_34b698 && window.BOARD_SCENES && window.BOARD_SCENES.empty) this.forceUpdate();
            else setTimeout(wait, 20);
          };
          wait();
        }
        renderVals() {
          const rootStyle = {width: (this.props.width || 1440) + "px", height: "52px"};
          const key = this.props.scene || "morning";
          const scene = window.BOARD_SCENES && window.BOARD_SCENES[key];
          const off = {brand: {}, needYou: {}, running: {}, queued: {}, done: {}, read: {}, refresh: {}, settings: {}};
          if (!window.MMW || !scene) return {rootStyle, ...off};
          window.MMW_NOW = scene.now;
          const v = window.MMW.topbar.fromBoard({...scene.payload, settingsOpen: !!this.props.settingsOpen}, new Date(scene.now));
          const hot = v.orangeN > 0;
          return {
            rootStyle,
            brand: {repo: scene.payload.repo || "chancheuklap/multi-model-workflow", "data-ui": "顶栏.brand"},
            needYou: {button: true, hot, lamp: hot ? "orange" : "hollow", label: "needs you", count: v.orangeN,
              title: "跳到下一张 needs you 的 ticket", onClick: () => this.props.onJumpNeedYou && this.props.onJumpNeedYou(),
              "data-ui": "顶栏.needs-you"},
            running: {lamp: "green", label: "running", count: v.greenN, sub: v.waiting ? "waiting for a slot " + v.waiting : null, "data-ui": "顶栏.running"},
            queued: {lamp: "hollow", label: "queued", count: v.hollowN, "data-ui": "顶栏.queued"},
            done: {lamp: "ink", label: "done", count: v.inkN, "data-ui": "顶栏.done"},
            read: v.readFailed
              ? {failed: true, text: "读 GitHub 失败 · 下面是 " + v.readClock + " 的数据（" + v.readAgo + " 分钟前）", "data-ui": "顶栏.read-state"}
              : {failed: false, text: v.readClock ? "只读 · " + v.readClock + " 读取" : "", "data-ui": "顶栏.read-state"},
            refresh: {icon: "refresh", label: "立刻重读 GitHub", title: "立刻重读 GitHub（页面开着时每分钟自动读一次）",
              onClick: () => this.props.onRefresh && this.props.onRefresh(), "data-ui": "顶栏.refresh"},
            settings: {icon: "settings", on: v.settingsOpen, label: "本机配置", title: "本机配置：每个 agent 跑在哪个 host、model、effort",
              onClick: () => this.props.onOpenSettings && this.props.onOpenSettings(), "data-ui": "顶栏.settings"},
          };
        }
      }
    </script>
  </body>
</html>

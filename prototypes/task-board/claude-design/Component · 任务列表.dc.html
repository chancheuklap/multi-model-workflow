<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="stylesheet" href="./_ds/mmw-task-board-2-34b69870-86b7-4125-a104-b9560bcf3956/styles.css" />
        <script src="./data/tasks-scenes.js"></script>
      </helmet>
      <nav data-ui="任务列表.root" class="tasks board" aria-label="The Night" data-screen-label="任务列表" style="{{ rootStyle }}">
        <div class="col-eyebrow" data-ui="任务列表.eyebrow">
          <span data-ui="任务列表.eyebrow.label">The Night</span>
          <span data-ui="任务列表.eyebrow.count">{{ count }}</span>
        </div>
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
          <p class="tasks-empty" data-ui="任务列表.empty">没有带 mmw:map label 的 ticket。</p>
        </sc-if>
        <sc-for list="{{ rows }}" as="row" hint-placeholder-count="3">
          <button type="button" class="{{ row.cls }}" data-ui="任务列表.task" onClick="{{ row.pick }}">
            <span class="{{ row.lampCls }}" title="{{ row.lampWord }}" data-ui="任务列表.task.lamp"></span>
            <span class="task-meta" data-ui="任务列表.task.meta">{{ row.meta }}</span>
            <span class="{{ row.titleCls }}" data-ui="任务列表.task.title">{{ row.title }}</span>
            <span class="task-progress">
              <span class="bar"><span class="bar-fill" style="{{ row.barStyle }}" data-ui="任务列表.task.bar"></span></span>
              <span class="task-count" data-ui="任务列表.task.count">{{ row.count }}</span>
            </span>
          </button>
        </sc-for>
      </nav>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{
  "$preview": { "width": 236, "height": 848 },
  "scene": { "editor": "enum", "options": ["morning", "twenty-tickets", "bad-data", "empty"], "default": "morning" }
}'>
      class Component extends DCLogic {
        componentDidMount() {
          const wait = () => {
            if (window.TASK_SCENES) this.forceUpdate();
            else setTimeout(wait, 20);
          };
          wait();
        }
        renderVals() {
          const LAMP_WORD = {orange: "needs you", green: "running", hollow: "queued", ink: "done"};
          const rootStyle = {width: (this.props.width || 236) + "px", height: (this.props.height || 848) + "px"};
          const scene = window.TASK_SCENES && window.TASK_SCENES[this.props.scene || "morning"];
          if (!scene) return {rootStyle, count: 0, empty: false, rows: []};
          const selected = this.props.task !== undefined ? this.props.task
            : this.state && this.state.task != null ? this.state.task
            : scene.selected;
          const rows = scene.tasks.map(t => {
            const on = t.n === selected;
            return {
              cls: on ? "task on" : "task",
              titleCls: on ? "task-title on" : "task-title",
              lampCls: "lamp " + t.lamp,
              lampWord: LAMP_WORD[t.lamp],
              meta: "#" + t.n + " · " + t.kind,
              title: t.title,
              barStyle: {width: (t.total ? 100 * t.landed / t.total : 0) + "%"},
              count: t.landed + "/" + t.total + " landed",
              pick: () => {
                this.setState({task: t.n});
                if (this.props.onSelectTask) this.props.onSelectTask(t.n);
              },
            };
          });
          return {rootStyle, count: scene.tasks.length, empty: !scene.tasks.length, rows};
        }
      }
    </script>
  </body>
</html>

  },
  aggregate(tickets) {
    const ls = tickets.map(Board.light);
    if (ls.includes('orange')) return 'orange';
    if (ls.includes('green')) return 'green';
    if (ls.length && ls.every(l => l === 'ink')) return 'ink';
    return 'hollow';
  },
  decisionLight: d => (d.state === 'closed' ? 'ink' : 'hollow'),
  // Whether a blocker has let go of the ticket it blocks — events.py `blocker_hold`, the rule
  // `advance` and `--preflight` use: its work is on the base branch (`ticket.landed`), or it
  // closed without a pass, by a person or as not planned, so nothing of it will ever land. A
  // closed blocker whose events cannot be read has not said which, and holds.
  released: a => a.state === 'closed' && !a.fold.unreadable.length && (!a.fold.passed || a.fold.landed),
  // What one blocking edge says, read from both ends.
  //   done     grey, solid     the blocker let go and the blocked is not running: it landed,
  //                            was returned, did not land, or its spec is suspended — its own
  //                            lamp and pill say which
  //   flow     green, moving   the blocker let go and the blocked is being worked on now
  //   blocked  red, still      the blocker still holds: the blocked waits on it
  // "Let go but not dispatched" is not a state: `advance` lands a ticket and dispatches
  // what that unblocks in one indivisible run (#316 §5), with no cap on workers (#315 §9).
  edgeState(a, b, type) {
    if (type === 'decision') return a.state === 'closed' ? 'done' : 'blocked';
    if (!Board.released(a)) return 'blocked';
    return Board.running(b) ? 'flow' : 'done';
  },
  allTickets: task => task.specs.flatMap(s => s.tickets),
  progress(task) {
    const all = Board.allTickets(task);
    return { done: all.filter(t => t.fold.landed).length, total: all.length };
  },

  // Blocking inside one container: layers by longest path from the unblocked,
  // cycles detected (Kahn), and the edges a reader needs after dropping the ones
  // another chain already implies.
  graph(items) {
    const ids = new Set(items.map(i => i.n));
    const preds = new Map(items.map(i => [i.n, i.blocked.filter(b => ids.has(b))]));
    const succ = new Map(items.map(i => [i.n, []]));
    for (const [v, ps] of preds) for (const u of ps) succ.get(u).push(v);
    const indeg = new Map(items.map(i => [i.n, preds.get(i.n).length]));
    const layer = new Map();
    const queue = items.filter(i => indeg.get(i.n) === 0).map(i => i.n);
    for (const n of queue) layer.set(n, 0);
    while (queue.length) {
      const u = queue.shift();
      for (const v of succ.get(u)) {
        layer.set(v, Math.max(layer.get(v) ?? 0, layer.get(u) + 1));
        indeg.set(v, indeg.get(v) - 1);
        if (indeg.get(v) === 0) queue.push(v);
      }
    }
    const cyclic = new Set(items.filter(i => !layer.has(i.n)).map(i => i.n));
    const maxLayer = Math.max(-1, ...layer.values());
    for (const n of cyclic) layer.set(n, maxLayer + 1);
    const reach = (from, to, skipDirect) => {
      const seen = new Set(), stack = [...succ.get(from).filter(w => !(skipDirect && w === to))];
      while (stack.length) {
        const w = stack.pop();
        if (w === to) return true;
        if (seen.has(w)) continue;
        seen.add(w);
        stack.push(...succ.get(w));
      }
      return false;
    };
    const edges = [];
    for (const [v, ps] of preds) for (const u of ps) {
      const cyc = cyclic.has(u) && cyclic.has(v);
      if (!cyc && reach(u, v, true)) continue;
      edges.push({ from: u, to: v, cyc });
    }
    return { layer, preds, cyclic, edges };
  },

  layout(task, expanded) {
    const G = { mapX: 12, trunkX: 30, specX: 52, contR: 220, x0: 272, tW: 184, tH: 94, dW: 164, dH: 62, colGap: 84, rowGap: 14, cH: 72 };
    const nodes = [], edges = [], labels = [];
    const band = (items, top, w, h) => {
      const g = Board.graph(items);
      const byLayer = new Map();
      for (const it of items) {
        const L = g.layer.get(it.n);
        if (!byLayer.has(L)) byLayer.set(L, []);
        byLayer.get(L).push(it);
      }
      const pos = new Map();
      let bottom = top;
      for (const L of [...byLayer.keys()].sort((a, b) => a - b)) {
        const col = byLayer.get(L).map(it => {
          const ps = g.preds.get(it.n).filter(p => pos.has(p));
          const want = ps.length ? ps.reduce((s, p) => s + pos.get(p).y, 0) / ps.length : top;
          return { it, want };
        }).sort((a, b) => a.want - b.want || a.it.n - b.it.n);
        let y = top;
        for (const c of col) {
          y = Math.max(c.want, y);
          pos.set(c.it.n, { x: G.x0 + L * (w + G.colGap), y });
          y += h + G.rowGap;
        }
        bottom = Math.max(bottom, y - G.rowGap);
      }
      return { g, pos, height: bottom - top };
    };
    const expandCurve = (fromY, n) => {
      const x1 = G.contR, x2 = n.x, y2 = n.y + n.h / 2;
      return `M ${x1} ${fromY} C ${x1 + 26} ${fromY}, ${x2 - 26} ${y2}, ${x2} ${y2}`;
    };
    // A smooth S-curve leaving the blocker's right edge and entering the blocked card's
    // left edge, both tangents horizontal, so a chain reads left to right without arrowheads.
    const blockLine = (a, b, cyc) => {
      const x1 = a.x + a.w, y1 = a.y + a.h / 2;
      if (cyc) {
        const y2 = b.y + b.h / 2, bulge = x1 + 34;
        return `M ${x1} ${y1} C ${bulge} ${y1}, ${bulge} ${y2}, ${x1} ${y2}`;
      }
      const x2 = b.x, y2 = b.y + b.h / 2, dx = Math.max(28, (x2 - x1) * 0.55);
      return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
    };
    const place = (items, type, w, h, top, contId, contMidY) => {
      const r = band(items, top, w, h);
      const placed = new Map();
      for (const it of items) {
        const p = r.pos.get(it.n);
        const node = { id: it.n, type, ref: it, x: p.x, y: p.y, w, h, parent: contId, cyclic: r.g.cyclic.has(it.n) };
        nodes.push(node);
        placed.set(it.n, node);
      }
      for (const node of placed.values()) if (r.g.layer.get(node.id) === 0) edges.push({ kind: 'expand', from: contId, to: node.id, d: expandCurve(contMidY, node) });
      for (const e of r.g.edges) {
        const a = placed.get(e.from), b = placed.get(e.to);
        edges.push({ kind: 'block', from: e.from, to: e.to, cyc: e.cyc, state: e.cyc ? 'blocked' : Board.edgeState(a.ref, b.ref, type),
          d: blockLine(a, b, e.cyc), ends: [[a.x + a.w, a.y + a.h / 2], e.cyc ? [a.x + a.w, b.y + b.h / 2] : [b.x, b.y + b.h / 2]] });
      }
      if (r.g.cyclic.size) {
        const first = placed.get([...r.g.cyclic][0]);
        labels.push({ x: first.x, y: top - 18, text: `阻塞成环 · ${[...r.g.cyclic].map(n => '#' + n).join(' ⇄ ')} · 排不出先后`, warn: true });
      }
      return r.height;
    };

    let y = 40;
    const mapNode = { id: task.n, type: 'map', ref: task, x: G.mapX, y, w: G.contR - G.mapX, h: G.cH };
    nodes.push(mapNode);
    let mapBand = G.cH;
    if (task.decisions.length && expanded.has(task.n)) {
      labels.push({ x: G.x0, y: y - 18, text: `这次讨论自己的票 · ${task.decisions.length} 张` });
      mapBand = Math.max(G.cH, place(task.decisions, 'decision', G.dW, G.dH, y, task.n, y + G.cH / 2));
    }
    y += mapBand + 48;
    labels.push({ x: G.specX, y: y - 18, text: `讨论产出的 spec · ${task.specs.length} 个` });
    let lastMid = y;
    for (const spec of task.specs) {
      const sNode = { id: spec.n, type: 'spec', ref: spec, x: G.specX, y, w: G.contR - G.specX, h: G.cH };
      nodes.push(sNode);
      lastMid = y + G.cH / 2;
      edges.push({ kind: 'trunk', d: `M ${G.trunkX} ${lastMid - 10} Q ${G.trunkX} ${lastMid} ${G.trunkX + 10} ${lastMid} H ${G.specX}` });
      let h = G.cH;
      if (expanded.has(spec.n)) h = Math.max(G.cH, place(spec.tickets, 'ticket', G.tW, G.tH, y, spec.n, lastMid));
      y += h + 26;
    }
    edges.unshift({ kind: 'trunk', d: `M ${G.trunkX} ${mapNode.y + mapNode.h} V ${lastMid - 10}` });
    const W = Math.max(...nodes.map(n => n.x + n.w)) + 60;
    const H = Math.max(...nodes.map(n => n.y + n.h)) + 60;
    return { nodes, edges, labels, W, H };
  },
};
/* BOARD:END */

/* SETTINGS-LOGIC:BEGIN */
/* ════════════════════════════════════════════════════════════════════════
   SETTINGS LOGIC — one scan of this machine's hosts and one configuration in;
   what the settings sheet offers, flags and would change out. No DOM here: it
   is the sheet's half of #318's testing seam, and build_fixtures.py copies it
   into the Claude Design port so the two agree. A `scan` maps each host to its
   `state` — missing (its CLI is not installed), silent (it answered nothing),
   down (Paseo was asked and its daemon is not running) or ok — and the models
   it `offered` with their efforts. Before any of that, a host the runner cannot
   start at all is `unlaunchable`: hosts.json gives it no `cli` block for orca
   and herdr, or no `paseo` block for Paseo. A configuration is { runner, rows:
   { agent: { host, model, effort } } }; `auto` as a runner lets `start` look at
   the runner it runs in.
   ════════════════════════════════════════════════════════════════════════ */
const LocalConfig = {
  CELLS: ['host', 'model', 'effort'],
  ROLE_WHAT: {
    'junior-worker': '贴 junior-worker label 的票',
    'senior-worker': '贴 senior-worker label 的票',
    reviewer: '评审每张票的改动',
    verifier: '复验每张票的判据',
    advisor: '被问到时给第二意见',
  },
  // Which place the options are asked of: Paseo when the runner is paseo, each host's own
  // CLI otherwise — the place `start` asks when it resolves the same row.
  source: d => (d.runner === 'paseo' ? 'paseo' : 'cli'),
  hostScan: (scan, host) => scan[host] || { state: 'missing', offered: [] },
  // A host's state under the draft's runner: `unlaunchable` when that runner cannot start it
  // however well it answers, else what the scan says.
  hostState(scan, d, host) {
    const launch = SETTINGS.launch[host] || {};
    return launch[LocalConfig.source(d)] ? LocalConfig.hostScan(scan, host).state : 'unlaunchable';
  },
  offeredBy: (scan, host) => LocalConfig.hostScan(scan, host).offered,
  effortsOf: (scan, host, model) => (LocalConfig.offeredBy(scan, host).find(o => o.model === model) || { efforts: [] }).efforts,
  stateWord: (state, d) => ({ missing: '本机没装', silent: '没有回答', down: 'Paseo 没开',
    unlaunchable: d && LocalConfig.source(d) === 'paseo' ? 'Paseo 起不了' : 'orca、herdr 起不了' }[state] || state),
  hostWhy: (state, host, d) => ({
    missing: `这台机器上没装 ${host} 的 CLI（${SETTINGS.binaries[host]}），换一个这台机器有的`,
    silent: `${host} 的 CLI 在扫描时没有回答，换一个这台机器有的`,
    down: `Paseo 服务没开，问不到 ${host} 的 model；先开 Paseo，或者把 runner 换回 orca 或 herdr`,
    unlaunchable: LocalConfig.source(d) === 'paseo'
      ? `Paseo 起不了 ${host}：hosts.json 没给它 paseo 块；换一个 host`
      : `orca 和 herdr 起不了 ${host}：hosts.json 没给它命令行启动块（cli）；换一个 host，或者把 runner 换成 paseo`,
  }[state]),

  // Everything `start` would refuse, and why — in the order it meets them: the host, then
  // the model on that host, then the effort of that model.
  problems(scan, d) {
    const L = LocalConfig, out = [];
    if (d.runner !== 'auto' && !SETTINGS.runners.includes(d.runner)) out.push({ key: 'runner', cell: 'runner', text: `${d.runner} 没有适配器，start 起不了会话` });
    for (const a of SETTINGS.agents) {
      const r = d.rows[a];
      if (!SETTINGS.hosts.includes(r.host)) { out.push({ key: a, cell: 'host', text: `${r.host} 不是 MMW 认识的 host` }); continue; }
      const hs = L.hostScan(scan, r.host), st = L.hostState(scan, d, r.host);
      if (st !== 'ok') { out.push({ key: a, cell: 'host', text: L.hostWhy(st, r.host, d) }); continue; }
      if (!r.model) { out.push({ key: a, cell: 'model', text: '还没选 model' }); continue; }
      if (!hs.offered.some(o => o.model === r.model)) { out.push({ key: a, cell: 'model', text: `这台机器的 ${r.host} 已经不提供 ${r.model}` }); continue; }
      if (!r.effort) { out.push({ key: a, cell: 'effort', text: '还没选 effort' }); continue; }
      if (!L.effortsOf(scan, r.host, r.model).includes(r.effort)) out.push({ key: a, cell: 'effort', text: `${r.model} 在 ${r.host} 上没有 ${r.effort} 这一档` });
    }
    return out;
  },
  // What a save would change, one entry per row that now runs on something else.
  changes(d, s) {
    const out = d.runner !== s.runner ? [{ key: 'runner', text: 'runner', cells: ['runner'] }] : [];
    for (const a of SETTINGS.agents) {
      const cells = LocalConfig.CELLS.filter(c => d.rows[a][c] !== s.rows[a][c]);
      if (cells.length) out.push({ key: a, text: `${a} 的 ${cells.join('、')}`, cells });
    }
    return out;
  },
  // One cell of the draft `d` changed. A changed host keeps the model if the new host
  // offers it too, else waits for a choice; the effort follows the same way, and a model
  // with only one legal effort takes it.
  setCell(scan, d, key, cell, value) {
    const L = LocalConfig;
    if (key === 'runner') { d.runner = value; return d; }
    const r = d.rows[key];
    r[cell] = value;
    if (cell === 'host' && !L.offeredBy(scan, value).some(o => o.model === r.model)) r.model = '';
    if (cell !== 'effort') {
      const es = L.effortsOf(scan, r.host, r.model);
      if (!es.includes(r.effort)) r.effort = es.length === 1 ? es[0] : '';
    }
    return d;
  },

  // The options of each dropdown. A saved value this machine no longer offers stays in its
  // dropdown, named for what is wrong with it; an empty cell shows a disabled prompt.
  runnerOptions(d) {
    const opts = [
      ...(d.runner !== 'auto' && !SETTINGS.runners.includes(d.runner) ? [{ value: d.runner, text: `${d.runner} · 没有适配器` }] : []),
      ...SETTINGS.runners.map(r => ({ value: r, text: r })),
      { value: 'auto', text: '按所在环境判断' },
    ];
    return opts.map(o => ({ ...o, selected: o.value === d.runner, disabled: !!o.disabled }));
  },
  rowOptions(scan, d, a) {
    const L = LocalConfig, r = d.rows[a], hs = L.hostScan(scan, r.host);
    const hostOk = L.hostState(scan, d, r.host) === 'ok', modelKnown = hostOk && hs.offered.some(o => o.model === r.model);
    const mark = (opts, value) => opts.map(o => ({ ...o, selected: o.value === value, disabled: !!o.disabled }));
    const host = [
      ...(SETTINGS.hosts.includes(r.host) ? [] : [{ value: r.host, text: `${r.host} · MMW 不认识` }]),
      ...SETTINGS.hosts.map(h => {
        const st = L.hostState(scan, d, h);
        return { value: h, text: st === 'ok' ? h : `${h} · ${L.stateWord(st, d)}`, disabled: st !== 'ok' && h !== r.host };
      }),
    ];
    const model = !hostOk ? [{ value: r.model, text: r.model || '—' }] : [
      ...(!r.model ? [{ value: '', text: '选一个 model', disabled: true }] : modelKnown ? [] : [{ value: r.model, text: `${r.model} · 本机已经没有` }]),
      ...hs.offered.map(o => ({ value: o.model, text: o.model })),
    ];
    const effort = !modelKnown ? [{ value: r.effort, text: r.effort || '—' }] : [
      ...(!r.effort ? [{ value: '', text: '选一档', disabled: true }] : []),
      ...L.effortsOf(scan, r.host, r.model).map(e => ({ value: e, text: e === '—' ? '—（不设）' : e })),
    ];
    return { host: mark(host, r.host), model: mark(model, r.model), effort: mark(effort, r.effort), hostOk, modelKnown };
  },
  hostChips(scan, d) {
    return SETTINGS.hosts.map(h => {
      const s = LocalConfig.hostScan(scan, h), st = LocalConfig.hostState(scan, d, h);
      return { host: h, state: st, what: st === 'ok' ? `${s.offered.length} 个 model` : LocalConfig.stateWord(st, d) };
    });
  },
};
/* SETTINGS-LOGIC:END */


/* ════════════════════════════════════════════════════════════════════════
   PAGE — render and wire. State: scene, task, selection, expanded, view.
   ════════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const S = { scene: 'morning', task: null, sel: null, expanded: new Set(), view: { x: 24, y: 12, k: 1 }, layout: null };

function scene() { return FIXTURES[S.scene]; }
function currentTask() { return scene().tasks.find(t => t.n === S.task) || null; }
function findAnywhere(n) {
  for (const task of scene().tasks) {
    if (task.n === n) return { type: 'map', ref: task, task };
    for (const d of task.decisions) if (d.n === n) return { type: 'decision', ref: d, task };
    for (const s of task.specs) {
      if (s.n === n) return { type: 'spec', ref: s, task };
      for (const t of s.tickets) if (t.n === n) return { type: 'ticket', ref: t, task, spec: s };
    }
  }
  return null;
}

function defaultExpanded(task) {
  const set = new Set([task.n]);
  for (const s of task.specs) {
    const l = Board.aggregate(s.tickets);
    if (l === 'orange' || l === 'green') set.add(s.n);
  }
  if (task.specs.length === 1) set.add(task.specs[0].n);
  return set;
}

function loadScene(key, keepView) {
  S.scene = key;
  S.refreshedAt = null;
  const sc = scene();
  S.task = sc.select.task ?? sc.tasks[0]?.n ?? null;
  S.sel = sc.select.node ?? null;
  S.expanded = currentTask() ? defaultExpanded(currentTask()) : new Set();
  renderAll();
  requestAnimationFrame(() => initialView());
}

function selectTask(n) {
  if (S.task === n) return;
  S.task = n; S.sel = null;
  S.expanded = defaultExpanded(currentTask());
  renderAll();
  requestAnimationFrame(() => initialView());
}

/* ── top bar ─────────────────────────────────────────── */
function renderTop() {
  const sc = scene();
  const all = sc.tasks.flatMap(Board.allTickets);
  const count = l => all.filter(t => Board.light(t) === l).length;
  const waiting = all.filter(t => Board.step(t) === 'waiting').length;
  const orange = count('orange');
  $('counters').innerHTML = `
    <button class="counter ${orange ? 'hot' : ''}" id="need-you" ${orange ? '' : 'disabled'} title="${orange ? '跳到下一张需要你的票' : ''}">
      <span class="light ${orange ? 'orange' : 'hollow'}"></span>需要你 <span class="counter-n">${orange}</span></button>
    <span class="counter"><span class="light green"></span>在跑 <span class="counter-n">${count('green')}</span>${waiting ? `<span class="counter-sub">其中等槽位 ${waiting}</span>` : ''}</span>
    <span class="counter"><span class="light hollow"></span>待派 <span class="counter-n">${count('hollow')}</span></span>
    <span class="counter"><span class="light ink"></span>好了 <span class="counter-n">${count('ink')}</span></span>`;
  // The board reads GitHub while the page is open: everything once on opening, then every minute
  // the comments of the tickets not yet landed, and the whole tree every ten minutes. The
  // refresh button reads now.
  const readAt = S.refreshedAt && !sc.readFailed ? S.refreshedAt : sc.readAt;
  $('readstate').className = 'readstate' + (sc.readFailed ? ' failed' : '');
  $('readstate').textContent = sc.readFailed
    ? `读 GitHub 失败 · 下面是 ${hhmm(sc.readAt)} 的数据（${minutes(sc.readAt)} 分钟前）`
    : `只读 · ${hhmm(readAt)} 读取`;
  const btn = $('need-you');
  if (orange) btn.onclick = jumpToNextOrange;
}

function jumpToNextOrange() {
  const list = [];
  for (const task of scene().tasks) for (const s of task.specs) for (const t of s.tickets) if (Board.light(t) === 'orange') list.push({ task, s, t });
  if (!list.length) return;
  const i = list.findIndex(x => x.t.n === S.sel);
  const next = list[(i + 1) % list.length];
  if (S.task !== next.task.n) { S.task = next.task.n; S.expanded = defaultExpanded(next.task); }
  S.expanded.add(next.s.n);
  S.sel = next.t.n;
  renderAll();
  requestAnimationFrame(() => centerOn(next.t.n));
}

/* ── left: tasks ─────────────────────────────────────── */
function renderTasks() {
  const sc = scene();
  if (!sc.tasks.length) {
    $('tasks').innerHTML = `<div class="col-eyebrow"><span>任务</span><span>0</span></div><p class="tasks-empty">没有带 mmw:map label 的票。</p>`;
    return;
  }
  $('tasks').innerHTML = `<div class="col-eyebrow"><span>任务</span><span>${sc.tasks.length}</span></div>` + sc.tasks.map(task => {
    const p = Board.progress(task);
    const l = Board.aggregate(Board.allTickets(task));
    return `<button class="task ${task.n === S.task ? 'on' : ''}" data-task="${task.n}">
      <span class="light ${l}" title="${LIGHT_WORD[l]}"></span><span class="task-meta">#${task.n} · ${task.kind}</span>
      <span class="task-title">${esc(task.title)}</span>
      <span class="task-progress"><span class="bar"><span class="bar-fill" style="width:${p.total ? (100 * p.done / p.total) : 0}%"></span></span><span class="task-count">${p.done}/${p.total} 落地</span></span>
    </button>`;
  }).join('');
}

/* ── centre: canvas ──────────────────────────────────── */
function cardHTML(node) {
  const on = node.id === S.sel ? ' on' : '';
  const style = `left:${node.x}px;top:${node.y}px;width:${node.w}px;height:${node.h}px`;
  if (node.type === 'ticket') {
    const t = node.ref, l = Board.light(t), st = Board.step(t), run = Board.runLine(t);
    return `<div class="card ticket${on}${t.closeout ? ' closeout' : ''}${node.cyclic ? ' cycle' : ''}" tabindex="0" data-node="${t.n}" style="${style}" title="${esc(t.title)}">
      <div class="card-top"><span class="light ${l}" title="${LIGHT_WORD[l]}"></span><span class="card-num">#${t.n}</span><span class="card-right"><span class="pill ${st}">${st}</span></span></div>
      <div class="card-title">${esc(t.title)}</div>
      <div class="card-run${run.flag ? ' flag' : ''}">${esc(run.text)}</div></div>`;
  }
  if (node.type === 'decision') {
    const d = node.ref, l = Board.decisionLight(d);
    return `<div class="card decision${on}" tabindex="0" data-node="${d.n}" style="${style}" title="${esc(d.title)}">
      <div class="card-top"><span class="light ${l}" style="width:8px;height:8px"></span><span class="card-num">#${d.n}</span><span class="card-right"><span class="card-kind">${d.kind}</span></span></div>
      <div class="card-title">${esc(d.title)}</div></div>`;
  }
  const c = node.ref, isMap = node.type === 'map';
  const tickets = isMap ? Board.allTickets(c) : c.tickets;
  const l = Board.aggregate(tickets);
  const done = tickets.filter(t => t.fold.landed).length;
  const canExpand = isMap ? c.decisions.length > 0 : c.tickets.length > 0;
  const open = S.expanded.has(c.n);
  return `<div class="card cont ${node.type}${on}" tabindex="0" data-node="${c.n}" style="${style}">
    <div class="card-top"><span class="light ${l}" title="${LIGHT_WORD[l]}"></span><span class="card-num">#${c.n}${isMap ? ' · ' + c.kind : ''}</span>
      <span class="card-right"><span class="card-count">${done}/${tickets.length}</span>${canExpand ? `<button class="chev" data-toggle="${c.n}" aria-expanded="${open}" aria-label="${open ? '收起' : '展开'} #${c.n}">${open ? '▾' : '▸'}</button>` : ''}</span></div>
    <div class="card-title">${esc(c.title)}</div>
    <div class="card-bar"><div class="card-bar-fill" style="width:${tickets.length ? 100 * done / tickets.length : 0}%"></div></div></div>`;
}

// The beam on a "flow" edge: a comet that travels along the curve itself, measured in
// pixels of arc, so it bends with the line however steep it gets. Five layers share one
// leading edge — a white head, then ever longer, ever fainter green — and one glow over
// the group, which together read as a tail fading out behind the light. Every beam moves
// at the same speed, so a longer wait-line takes longer to cross; each starts at its own
// phase, so the canvas never pulses in unison. When the head reaches the blocked card a
// ring spreads from its port and fades.
const REDUCED = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
const BEAM_SPEED = 170; // px per second
const COMET = [ // length px, stroke width, colour, opacity — tail first, head last
  [64, 3.4, '#22a06b', 0.10], [40, 3.2, '#22a06b', 0.22], [24, 3.0, '#2fbf7e', 0.45],
  [12, 2.8, '#46d894', 0.85], [5, 2.6, '#effff6', 1],
];
function curveLength([x1, y1], [x2, y2]) {
  const dx = Math.max(28, (x2 - x1) * 0.55);
  const P = [[x1, y1], [x1 + dx, y1], [x2 - dx, y2], [x2, y2]];
  let len = 0, prev = P[0];
  for (let i = 1; i <= 32; i++) {
    const t = i / 32, u = 1 - t;
    const pt = [0, 1].map(k => u * u * u * P[0][k] + 3 * u * u * t * P[1][k] + 3 * u * t * t * P[2][k] + t * t * t * P[3][k]);
    len += Math.hypot(pt[0] - prev[0], pt[1] - prev[1]);
    prev = pt;
  }
  return len;
}
function beamSVG(e, pulse = true) {
  if (REDUCED) return `<path class="e-beam still" d="${e.d}"/>`;
  const [a, b] = e.ends;
  const len = curveLength(a, b);
  const tail = COMET[0][0];
  const dur = Math.max(0.9, (len + tail) / BEAM_SPEED);
  const begin = -(((a[0] * 7 + a[1] * 3 + b[1]) / 53) % dur);
  const f = n => +n.toFixed(2);
  // A dash of length L drawn from -offset to -offset+L; its leading edge p runs 0 → len+tail.
  const layers = COMET.map(([L, w, color, op]) =>
    `<path d="${e.d}" stroke="${color}" stroke-opacity="${op}" stroke-width="${w}" stroke-dasharray="${f(L)} ${f(len + tail * 3)}" stroke-dashoffset="${f(L)}">
      <animate attributeName="stroke-dashoffset" from="${f(L)}" to="${f(L - len - tail)}" dur="${f(dur)}s" begin="${f(begin)}s" repeatCount="indefinite"/></path>`).join('');
  const arrive = begin + dur * len / (len + tail);
  return `<g class="e-beam">${layers}</g>${pulse ? `<circle class="e-pulse" cx="${b[0]}" cy="${b[1]}" r="2.6" opacity="0">
      <animate attributeName="r" values="2.6;11" dur="${f(dur)}s" begin="${f(arrive)}s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="${f(dur)}s" begin="${f(arrive)}s" repeatCount="indefinite"/>
    </circle>` : ''}`;
}

function renderCanvas() {
  const task = currentTask();
  const world = $('world');
  const old = $('canvas').querySelector('.canvas-empty');
  if (old) old.remove();
  if (!task) {
    world.innerHTML = '';
    $('legend').hidden = true; $('zoom').hidden = true;
    $('canvas').insertAdjacentHTML('beforeend', `<div class="canvas-empty"><div>
      <p class="canvas-empty-title">还没有任务</p>
      <p class="canvas-empty-text">一个任务就是一次讨论开出的那张票。给它打上 <code>mmw:map</code> label，下一次读取时它和它下面的 spec、ticket 就会出现在这里。</p></div></div>`);
    return;
  }
  $('legend').hidden = false; $('zoom').hidden = false;
  const L = S.layout = Board.layout(task, S.expanded);
  const selIsTicket = L.nodes.some(n => n.id === S.sel && (n.type === 'ticket' || n.type === 'decision'));
  // Paint order: the quiet states first, so a moving green line is never under a grey one.
  const order = { done: 0, blocked: 1, flow: 2 };
  const blocks = L.edges.filter(e => e.kind === 'block').sort((a, b) => order[a.state] - order[b.state]);
  const svg = `<svg class="edges" width="${L.W}" height="${L.H}" viewBox="0 0 ${L.W} ${L.H}" aria-hidden="true">
    ${L.edges.filter(e => e.kind !== 'block').map(e => `<path class="${e.kind === 'trunk' ? 'e-trunk' : 'e-expand'}" d="${e.d}"/>`).join('')}
    ${blocks.map(e => {
      const hot = selIsTicket && (e.from === S.sel || e.to === S.sel);
      const cls = `e-block ${e.state}${hot ? ' hot' : ''}${e.cyc ? ' cyc' : ''}`;
      const ports = e.ends.map(([x, y]) => `<circle class="e-port ${e.state}" cx="${x}" cy="${y}" r="2.6"/>`).join('');
      if (e.state !== 'flow') return `<path class="${cls}" d="${e.d}"/>${ports}`;
      return `<path class="${cls}" d="${e.d}"/>${beamSVG(e)}${ports}`;
    }).join('')}</svg>`;
  world.style.width = L.W + 'px';
  world.style.height = L.H + 'px';
  world.innerHTML = svg
    + L.labels.map(lb => `<div class="lane-label${lb.warn ? ' warn' : ''}" style="left:${lb.x}px;top:${lb.y}px">${esc(lb.text)}</div>`).join('')
    + L.nodes.map(cardHTML).join('');
  applyView();
}

/* ── right: detail ───────────────────────────────────── */
function relRow(n, here) {
  const f = findAnywhere(n);
  if (!f) return `<div class="rel static"><span></span><span class="rel-num">#${n}</span><span class="rel-title">不在这棵树里，读不到它的状态</span><span class="rel-state open">未知</span></div>`;
  let light, state;
  if (f.type === 'ticket') {
    light = Board.light(f.ref);
    state = f.ref.fold.landed ? '已合入' : here !== 'blocker' ? LIGHT_WORD[light] : Board.released(f.ref) ? '没过就关了，已放行' : '未合入';
  } else { light = Board.decisionLight(f.ref); state = f.ref.state === 'closed' ? '已关闭' : '开着'; }
  const other = f.spec && f.spec.n !== detailSpecN ? ` · spec #${f.spec.n}` : '';
  return `<button class="rel" data-goto="${n}"><span class="light ${light}"></span><span class="rel-num">#${n}</span><span class="rel-title">${esc(f.ref.title)}<span class="rel-state">${other}</span></span><span class="rel-state ${state === '未合入' ? 'open' : ''}">${state}</span></button>`;
}
let detailSpecN = null;

function stepPath(st) {
  const i = STEPS.indexOf(st);
  return `<div class="path">${STEPS.map((s, j) => `<span class="path-step ${j < i ? 'done' : ''} ${j === i ? 'now ' + s : ''}">${s}</span>`).join('<span class="path-sep">›</span>')}</div>`;
}

function ticketDetail(found) {
  const t = found.ref, f = t.fold, l = Board.light(t), st = Board.step(t), why = Board.why(t);
  detailSpecN = found.spec.n;
  const w = f.worker, elapsed = Board.elapsed(t);
  const stopped = Board.stopped(t);
  const blocks = found.spec.tickets.filter(x => x.blocked.includes(t.n)).map(x => x.n);
  const kids = Object.values(f.children);
  const kidTo = k => {
    if (k.resolution === 'fixed') return { text: '已修' };
    if (k.resolution === 'stale') return { text: '条件已不成立' };
    if (k.resolution === 'became-ticket') return { text: `变成了 #${k.ticket}`, goto: k.ticket };
    if (NEEDS_YOU_KIND[k.kind]) return { text: '等你', cls: 'orange' };
    return { text: k.kind === 'deferred' ? '留给以后的票' : '等收口那一轮' };
  };
  const kidLight = k => (k.resolution ? 'ink' : NEEDS_YOU_KIND[k.kind] ? 'orange' : 'hollow');
  return `
    <div class="dp-head"><span class="dp-eyebrow">Ticket</span><button class="dp-close" data-close aria-label="关闭详情">×</button></div>
    <div class="dp-origin">#${t.n} · <button class="dp-origin-link" data-goto="${found.spec.n}">spec #${found.spec.n}</button> · <button class="dp-origin-link" data-goto="${found.task.n}">map #${found.task.n}</button></div>
    ${t.closeout ? `<div class="dp-closeout"><span class="dp-closeout-bar"></span>收口那一轮新开 · 出自 <button class="dp-origin-link" data-goto="${t.closeout.from}">#${t.closeout.from}</button> 的 finding #${t.closeout.child}</div>` : ''}
    <h2 class="dp-title">${esc(t.title)}</h2>
    <div class="dp-status"><span class="light ${l} big"></span><span class="status-word ${l}">${LIGHT_WORD[l]}</span><span class="dp-elapsed">${elapsed}</span></div>
    <div class="dp-step"><span class="pill ${st} big">${st}</span><span class="dp-hint">${st === 'landed' ? '走完了' : stopped ? '停在这一步' : st === 'queued' ? '还没开始' : '现在在这一步'}</span></div>
    ${stepPath(st)}
    ${why.length ? `<div class="why"><span class="why-title">为什么是橙的</span>${why.map(x => x.child ? `<span><b>#${x.child} ${x.kind}</b> ${esc(x.title)}。${esc(x.text)}</span>` : `<span>${esc(x.text)}</span>`).join('')}</div>` : ''}
    <section class="dp-section">
      <div class="dp-section-title"><span>运行时</span><span>${f.sessions.length ? '取自 worker.started' : ''}</span></div>
      ${w ? `<dl class="facts">${Board.facts(t).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      ${f.sessions.length > 1 ? f.sessions.map(s => `<div class="session"><span class="session-kind">${s.kind}</span><span class="session-what">${esc(s.host)} · ${esc(s.model)} · ${esc(s.effort)}</span><span class="session-state ${s.live && !Board.stoppedByFault(t) ? 'live' : ''}">${Board.sessionState(s, t)}</span></div>`).join('') : ''}`
      : `<p class="rel-label" style="margin:0">尚未派发。frontier 选中它之后，这里会出现它跑在哪个 host、哪个 runner。</p>`}
    </section>
    <section class="dp-section">
      <div class="dp-section-title"><span>阻塞</span></div>
      <div class="rel-label">阻塞它的</div>
      ${t.blocked.length ? t.blocked.map(n => relRow(n, 'blocker')).join('') : '<div class="rel-label" style="color:var(--soft)">无，一开始就能动</div>'}
      <div class="rel-label">它阻塞的</div>
      ${blocks.length ? blocks.map(n => relRow(n, 'blocked')).join('') : '<div class="rel-label" style="color:var(--soft)">无</div>'}
    </section>
    <section class="dp-section">
      <div class="dp-section-title"><span>子 issue</span><span>${kids.length}</span></div>
      ${kids.length ? kids.map(k => { const to = kidTo(k); return `<div class="kid"><span class="light ${kidLight(k)}"></span><span class="kid-num">#${k.child}</span><span class="kid-kind">${k.kind}</span><span class="kid-to ${to.cls || ''}">${to.goto ? `<button class="dp-origin-link" data-goto="${to.goto}">${to.text}</button>` : to.text}</span><span class="kid-title">${esc(k.title)}</span></div>`; }).join('') : '<div class="rel-label" style="color:var(--soft)">没有开出子 issue</div>'}
    </section>
    <section class="dp-section">
      <div class="dp-section-title"><span>事件</span><span>${t.events.length} 条评论</span></div>
      ${t.events.length ? `<div class="events">${t.events.map(e => {
        const el = Board.evLight(e);
        return `<div class="ev"><span class="light ${el}"></span>
          <div class="ev-head"><span class="ev-time">${hhmm(e.at)}</span><span class="ev-name ${el === 'orange' ? 'orange' : ''}">${e.event}</span><span class="ev-field">${esc(Board.evFields(e))}</span></div>
          <div class="ev-line">${esc(e.line)}</div></div>`;
      }).join('')}</div>` : '<div class="rel-label" style="color:var(--soft)">还没有事件。第一条会是 worker.started。</div>'}
    </section>
    <button class="dp-gh" data-gh="${t.n}">在 GitHub 打开 #${t.n} ↗</button>`;
}

function containerDetail(found) {
  const c = found.ref, isMap = found.type === 'map';
  const tickets = isMap ? Board.allTickets(c) : c.tickets;
  const l = Board.aggregate(tickets);
  const lc = k => tickets.filter(t => Board.light(t) === k).length;
  const sc = s => tickets.filter(t => Board.step(t) === s).length;
  const done = tickets.filter(t => t.fold.landed).length;
  detailSpecN = isMap ? null : c.n;
  return `
    <div class="dp-head"><span class="dp-eyebrow">${isMap ? 'Map · 任务' : 'Spec'}</span><button class="dp-close" data-close aria-label="关闭详情">×</button></div>
    <div class="dp-origin">#${c.n}${isMap ? ' · ' + c.kind : ` · <button class="dp-origin-link" data-goto="${found.task.n}">map #${found.task.n}</button>`}</div>
    <h2 class="dp-title">${esc(c.title)}</h2>
    <div class="dp-status"><span class="light ${l} big"></span><span class="status-word ${l}">${LIGHT_WORD[l]}</span><span class="dp-elapsed">${done}/${tickets.length} 落地</span></div>
    <section class="dp-section">
      <div class="dp-section-title"><span>${isMap ? '全部 ticket' : '它的 ticket'}</span><span>${tickets.length}</span></div>
      <div class="lights-count">${['orange', 'green', 'hollow', 'ink'].filter(k => lc(k)).map(k => `<span><span class="light ${k}"></span>${LIGHT_WORD[k]} <b>${lc(k)}</b></span>`).join('')}</div>
      <div class="steps-count">${STEPS.filter(s => sc(s)).map(s => `<span class="pill ${s}">${s} · ${sc(s)}</span>`).join('')}</div>
    </section>
    ${isMap ? `<section class="dp-section"><div class="dp-section-title"><span>spec</span><span>${c.specs.length}</span></div>
      ${c.specs.map(s => { const sl = Board.aggregate(s.tickets); const sd = s.tickets.filter(t => t.fold.landed).length;
        return `<button class="rel" data-goto="${s.n}"><span class="light ${sl}"></span><span class="rel-num">#${s.n}</span><span class="rel-title">${esc(s.title)}</span><span class="rel-state">${sd}/${s.tickets.length}</span></button>`; }).join('')}</section>
      ${c.decisions.length ? `<section class="dp-section"><div class="dp-section-title"><span>决策票</span><span>${c.decisions.length}</span></div>${c.decisions.map(d => relRow(d.n)).join('')}</section>` : ''}`
    : `<section class="dp-section"><div class="dp-section-title"><span>按票号</span></div>
      ${c.tickets.map(t => { const tl = Board.light(t), ts = Board.step(t);
        return `<button class="rel" data-goto="${t.n}"><span class="light ${tl}"></span><span class="rel-num">#${t.n}</span><span class="rel-title">${esc(t.title)}</span><span class="pill ${ts}">${ts}</span></button>`; }).join('')}</section>`}
    <button class="dp-gh" data-gh="${c.n}">在 GitHub 打开 #${c.n} ↗</button>`;
}

function decisionDetail(found) {
  const d = found.ref, l = Board.decisionLight(d);
  detailSpecN = null;
  const blocks = found.task.decisions.filter(x => x.blocked.includes(d.n)).map(x => x.n);
  return `
    <div class="dp-head"><span class="dp-eyebrow">决策票 · ${d.kind}</span><button class="dp-close" data-close aria-label="关闭详情">×</button></div>
    <div class="dp-origin">#${d.n} · <button class="dp-origin-link" data-goto="${found.task.n}">map #${found.task.n}</button></div>
    <h2 class="dp-title">${esc(d.title)}</h2>
    <div class="dp-status"><span class="light ${l} big"></span><span class="status-word ${l}">${d.state === 'closed' ? '已定' : '还开着'}</span></div>
    <section class="dp-section">
      <div class="dp-section-title"><span>阻塞</span></div>
      <div class="rel-label">阻塞它的</div>
      ${d.blocked.length ? d.blocked.map(n => relRow(n)).join('') : '<div class="rel-label" style="color:var(--soft)">无</div>'}
      <div class="rel-label">它阻塞的</div>
      ${blocks.length ? blocks.map(n => relRow(n)).join('') : '<div class="rel-label" style="color:var(--soft)">无</div>'}
    </section>
    <button class="dp-gh" data-gh="${d.n}">在 GitHub 打开 #${d.n} ↗</button>`;
}

function renderDetail() {
  const found = S.sel != null ? findAnywhere(S.sel) : null;
  if (!found) {
    $('detail').innerHTML = `<div class="dp-empty"><p class="dp-empty-title">${currentTask() ? '点一张卡' : '这里是详情'}</p>${currentTask() ? '画布上任意一张卡——map、spec、ticket 或决策票——点一下，它的全部细节就在这一栏。' : '有了任务之后，点画布上的卡，它的细节显示在这一栏。'}</div>`;
    return;
  }
  const body = found.type === 'ticket' ? ticketDetail(found) : found.type === 'decision' ? decisionDetail(found) : containerDetail(found);
  $('detail').innerHTML = `<div class="dp">${body}</div>`;
}

// While the settings sheet is open, the scene bar steps through its scenes instead of the board's.
function renderScenebar() {
  const keys = SET.open ? Object.keys(SETTINGS.scenes) : SCENES;
  const cur = SET.open ? SET.scene : S.scene;
  $('scenebar-tag').textContent = SET.open ? '示例场景 · 本机配置' : '示例场景';
  $('scene-idx').textContent = `${keys.indexOf(cur) + 1}/${keys.length}`;
  $('scene-name').textContent = (SET.open ? SETTINGS.scenes : FIXTURES)[cur].name;
}

function renderAll() { renderTop(); renderTasks(); renderCanvas(); renderDetail(); renderScenebar(); }

/* ── view: pan and zoom ──────────────────────────────── */
function applyView() {
  const v = S.view;
  $('world').style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.k})`;
  $('zoom-level').textContent = Math.round(v.k * 100) + '%';
}
function clampK(k) { return Math.min(1.6, Math.max(0.3, k)); }
function zoomAt(k2, cx, cy) {
  const v = S.view; k2 = clampK(k2);
  v.x = cx - (cx - v.x) * (k2 / v.k);
  v.y = cy - (cy - v.y) * (k2 / v.k);
  v.k = k2; applyView();
}
function fit() {
  if (!S.layout) return;
  const r = $('canvas').getBoundingClientRect();
  const k = clampK(Math.min(1, (r.width - 40) / S.layout.W, (r.height - 70) / S.layout.H));
  S.view = { k, x: Math.max(12, (r.width - S.layout.W * k) / 2), y: 12 };
  applyView();
}
function initialView() {
  if (!S.layout) return;
  const r = $('canvas').getBoundingClientRect();
  const kFit = Math.min((r.width - 40) / S.layout.W, (r.height - 70) / S.layout.H);
  const v = S.view = { k: clampK(Math.max(0.9, Math.min(1, kFit))), x: 20, y: 12 };
  // Keep the trunk column in view; move only as far as the selected card needs.
  const b = S.sel != null ? nodeBox(S.sel) : null;
  if (b) {
    if ((b.y + b.h) * v.k + v.y > r.height - 70) v.y = Math.min(12, r.height * 0.45 - (b.y + b.h / 2) * v.k);
    if ((b.x + b.w) * v.k + v.x > r.width - 24) v.x = Math.min(20, r.width - 24 - (b.x + b.w) * v.k);
  }
  applyView();
}
function nodeBox(n) { return S.layout?.nodes.find(x => x.id === n); }
function centerOn(n) {
  const b = nodeBox(n); if (!b) return;
  const r = $('canvas').getBoundingClientRect(), v = S.view;
  v.x = r.width / 2 - (b.x + b.w / 2) * v.k;
  v.y = r.height / 2 - (b.y + b.h / 2) * v.k;
  applyView();
}
function ensureVisible(n) {
  const b = nodeBox(n); if (!b) return;
  const r = $('canvas').getBoundingClientRect(), v = S.view;
  const x1 = b.x * v.k + v.x, x2 = (b.x + b.w) * v.k + v.x, y1 = b.y * v.k + v.y, y2 = (b.y + b.h) * v.k + v.y;
  if (x1 < 0 || y1 < 0 || x2 > r.width || y2 > r.height - 56) centerOn(n);
}

const canvas = $('canvas');
let drag = null;
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('.zoom, .legend, .chev')) return;
  drag = { x: e.clientX, y: e.clientY, vx: S.view.x, vy: S.view.y, moved: false, id: e.pointerId };
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; canvas.classList.add('dragging'); canvas.setPointerCapture?.(drag.id); }
  if (drag.moved) { S.view.x = drag.vx + dx; S.view.y = drag.vy + dy; applyView(); }
});
window.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const moved = drag.moved; drag = null; canvas.classList.remove('dragging');
  if (moved) { suppressClick = true; setTimeout(() => (suppressClick = false), 0); }
});
let suppressClick = false;
canvas.addEventListener('wheel', e => {
  if (!S.layout) return;
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(S.view.k * Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
  else { S.view.x -= e.deltaX; S.view.y -= e.deltaY; applyView(); }
}, { passive: false });
$('zoom-in').onclick = () => { const r = canvas.getBoundingClientRect(); zoomAt(S.view.k * 1.2, r.width / 2, r.height / 2); };
$('zoom-out').onclick = () => { const r = canvas.getBoundingClientRect(); zoomAt(S.view.k / 1.2, r.width / 2, r.height / 2); };
$('zoom-fit').onclick = fit;

/* ── clicks ──────────────────────────────────────────── */
function select(n, center) {
  const f = findAnywhere(n); if (!f) return;
  if (f.task.n !== S.task) { S.task = f.task.n; S.expanded = defaultExpanded(f.task); }
  if (f.type === 'ticket') S.expanded.add(f.spec.n);
  if (f.type === 'decision') S.expanded.add(f.task.n);
  S.sel = n;
  renderAll();
  requestAnimationFrame(() => (center ? centerOn(n) : ensureVisible(n)));
}
$('world').addEventListener('click', e => {
  if (suppressClick) return;
  const t = e.target.closest('[data-toggle]');
  if (t) {
    const n = +t.dataset.toggle;
    S.expanded.has(n) ? S.expanded.delete(n) : S.expanded.add(n);
    renderCanvas();
    return;
  }
  const c = e.target.closest('[data-node]');
  if (c) select(+c.dataset.node, false);
});
$('world').addEventListener('keydown', e => {
  const c = e.target.closest('[data-node]');
  if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(+c.dataset.node, false); }
});
$('tasks').addEventListener('click', e => { const b = e.target.closest('[data-task]'); if (b) selectTask(+b.dataset.task); });
$('detail').addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { S.sel = null; renderCanvas(); renderDetail(); return; }
  const g = e.target.closest('[data-goto]');
  if (g) { if (findAnywhere(+g.dataset.goto)) select(+g.dataset.goto, true); return; }
  const gh = e.target.closest('[data-gh]');
  if (gh) toast(`示例数据：真的 board 在这里用新标签页打开 GitHub 上的 #${gh.dataset.gh}。board 自己不写票。`);
});
document.addEventListener('keydown', e => {
  if (SET.open) { settingsKey(e); return; }
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'Escape' && S.sel != null) { S.sel = null; renderCanvas(); renderDetail(); }
  if (e.key === 'ArrowRight' && !e.target.closest('[data-node]')) step(1);
  if (e.key === 'ArrowLeft' && !e.target.closest('[data-node]')) step(-1);
  if (e.key === 'f' && !e.metaKey && !e.ctrlKey) fit();
});
function step(d) {
  if (SET.open) {
    const keys = Object.keys(SETTINGS.scenes), i = keys.indexOf(SET.scene);
    loadSettings(keys[(i + d + keys.length) % keys.length]);
    return;
  }
  const i = SCENES.indexOf(S.scene);
  loadScene(SCENES[(i + d + SCENES.length) % SCENES.length]);
}
$('scene-prev').onclick = () => step(-1);
$('scene-next').onclick = () => step(1);

let toastTimer;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 3200);
}
window.addEventListener('resize', () => applyView());

/* ════════════════════════════════════════════════════════════════════════
   SETTINGS — which host, model and effort each agent runs on, and the runner:
   MMW's one configuration on this machine (#318 §12–17). The sheet renders what
   LocalConfig (above) computes; this part holds the sheet's state and wires
   it. A save reaches the next agent that starts; a session already running is
   left alone. In the mockup a save changes only the page.
   ════════════════════════════════════════════════════════════════════════ */
const SET = { open: false, scene: Object.keys(SETTINGS.scenes)[0], saved: null, draft: null, scannedAt: null,
  scanSource: 'cli', scanning: false, savedAt: null, refused: 0, reread: false, back: null };
const sScene = () => SETTINGS.scenes[SET.scene];
// The scan on screen: the one asked of the place the runner on screen sends `start` to.
const sScan = () => sScene().scans[SET.scanSource];
const copy = o => JSON.parse(JSON.stringify(o));
const later = m => new Date(new Date(NOW).getTime() + m * 60000).toISOString();

function loadSettings(key) {
  SET.scene = key;
  const sc = sScene();
  SET.saved = copy(sc.saved); SET.draft = copy(sc.saved); SET.scannedAt = sc.scannedAt;
  SET.scanSource = LocalConfig.source(sc.saved);
  SET.scanning = false; SET.savedAt = null; SET.refused = 0; SET.reread = false;
  renderSettings();
  renderScenebar();
}

function renderSettings() {
  if (!SET.open) return;
  const L = LocalConfig, sc = sScene(), scan = sScan(), d = SET.draft;
  const probs = SET.scanning ? [] : L.problems(scan, d), ch = L.changes(d, SET.saved);
  const bad = (key, cell) => probs.find(p => p.key === key && p.cell === cell);
  const select = (key, cell, options, label, disabled) => {
    const cls = bad(key, cell) ? ' bad' : ch.some(c => c.key === key && c.cells.includes(cell)) ? ' changed' : '';
    return `<select class="sel${cls}" id="set-${key}-${cell}" data-key="${key}" data-cell="${cell}" aria-label="${esc(label)}"${disabled ? ' disabled' : ''}>
      ${options.map(o => `<option value="${esc(o.value)}"${o.selected ? ' selected' : ''}${o.disabled ? ' disabled' : ''}>${esc(o.text)}</option>`).join('')}</select>`;
  };
  const foot = key => {
    const b = probs.filter(p => p.key === key).map(p => `<div class="role-bad"><span class="hatch"></span>${esc(p.text)}</div>`).join('');
    return b ? `<div class="role-foot">${b}</div>` : '';
  };
  const rowHTML = a => {
    const o = L.rowOptions(scan, d, a);
    return `<div class="role">
      <div class="role-name"><span class="role-agent">${a}</span><span class="role-what">${L.ROLE_WHAT[a]}</span></div>
      ${select(a, 'host', o.host, `${a} 的 host`, SET.scanning)}
      ${select(a, 'model', o.model, `${a} 的 model`, SET.scanning || !o.hostOk)}
      ${select(a, 'effort', o.effort, `${a} 的 effort`, SET.scanning || !o.modelKnown)}
      ${foot(a)}
    </div>`;
  };
  const hostChips = L.hostChips(scan, d).map(c =>
    `<span class="hs ${SET.scanning ? '' : c.state}"><span class="hs-name">${c.host}</span>${SET.scanning ? '…' : c.what}</span>`).join('');
  const when = '保存后，下一个新起的 agent 就用新值；已经在跑的不受影响。';

  let status;
  if (SET.refused) status = `<span class="foot-strong">没有保存</span><span class="foot-quiet">这一页打开之后，本机配置被别处改过，先重新读取。</span>`;
  else if (SET.scanning) status = `<span class="foot-strong">正在扫描本机的 host</span><span class="foot-quiet">扫描完之前不能保存。</span>`;
  else if (probs.length) status = `<span class="foot-strong"><span class="hatch"></span>有 ${probs.length} 处 start 会拒绝，改好之前不能保存</span><span class="foot-quiet">带斜线的格子，下面一行写着哪里不对。</span>`;
  else if (ch.length) status = `<span class="foot-strong">改了 ${ch.length} 处：${esc(ch.map(c => c.text).join('；'))}</span><span class="foot-quiet">${when}</span>`;
  else if (SET.savedAt) status = `<span class="foot-strong">已保存 · ${hhmm(SET.savedAt)}</span><span class="foot-quiet">从下一个新起的 agent 开始用；已经在跑的不受影响。</span>`;
  else status = `<span class="foot-strong">没有改动</span><span class="foot-quiet">上面就是下一个新起的 agent 会用的配置。</span>`;

  const at = sc.changedElsewhere?.at;
  $('settings').innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="set-title" aria-describedby="set-sub">
    <div class="sheet-head"><div class="sheet-head-text">
      <span class="dp-eyebrow">本机配置</span>
      <h2 class="sheet-title" id="set-title">这台机器上，每个角色跑在哪</h2>
      <p class="sheet-sub" id="set-sub">下拉菜单里的选项，是 MMW 刚问过这台机器上的 host 得到的，问的地方和 <span class="sheet-code">start</span> 起会话时问的是同一处。这里就是 MMW 管这件事的唯一地方，保存在本机的 <span class="sheet-code">${esc(SETTINGS.store)}</span>；这一页不写 GitHub。</p>
    </div><button class="dp-close" data-set-close aria-label="关闭本机配置">×</button></div>
    <div class="sheet-body">
      ${SET.refused ? `<div class="refused" role="alert"><p class="refused-text"><b>没有保存。</b>这一页打开之后，本机配置在 ${hhmm(at)} 被别处改过（一个 agent 从命令行改的）。重新读取会换成现在保存着的内容，你刚才改的 ${SET.refused} 处要再改一次。</p><button class="btn" id="set-reread">重新读取</button></div>` : ''}
      <section class="set-block">
        <div class="set-block-head"><span class="dp-section-title">本机的 host</span>
          <span class="scan">${SET.scanning ? `<span class="spin"></span>${L.source(d) === 'paseo' ? '正在向 Paseo 要每个 host 的 model…' : '正在问每个 host 的 CLI 有哪些 model…'}`
            : `${hhmm(SET.scannedAt)} 问${SET.scanSource === 'paseo' ? ' Paseo' : '各 host 的 CLI'} · <button class="linkbtn" id="set-rescan">重新扫描</button>`}</span></div>
        <div class="hostscan">${hostChips}</div>
      </section>
      <section class="set-block">
        <div class="runner-row">
          <div class="role-name"><span class="role-agent">runner</span><span class="role-what">用什么起会话</span></div>
          ${select('runner', 'runner', L.runnerOptions(d), 'runner', SET.scanning)}
          ${foot('runner')}
        </div>
        <p class="set-note">环境变量 <span class="sheet-code">MMW_RUNNER</span> 设了时，它优先于这一格。「按所在环境判断」让 <span class="sheet-code">start</span> 看自己跑在哪个 runner 里，判断不出时用 orca。runner 是 paseo 时，<span class="sheet-code">start</span> 向 Paseo 要 model，所以换到 paseo 或从 paseo 换走，选项会重新扫描。</p>
      </section>
      <section class="set-block">
        <div class="set-block-head"><span class="dp-section-title">一个角色一行</span></div>
        <div class="roles"><div class="roles-head"><span>agent</span><span>host</span><span>model</span><span>effort</span></div>
          ${SETTINGS.agents.map(rowHTML).join('')}</div>
        <p class="set-note">一台新机器第一次安装时，这里填的是 MMW 自带的初始值；之后只按这里选的跑，MMW 更新不会改它。</p>
      </section>
    </div>
    <div class="sheet-foot">
      <div class="foot-status" aria-live="polite">${status}</div>
      <div class="foot-actions">
        <button class="btn" data-set-close>${ch.length ? '取消' : '关闭'}</button>
        <button class="btn primary" id="set-save"${!ch.length || probs.length || SET.scanning || SET.refused ? ' disabled' : ''}>保存</button>
      </div>
    </div>
  </div>`;
}

function openSettings() {
  SET.open = true;
  SET.back = document.activeElement;
  $('settings').hidden = false;
  document.body.classList.add('modal-open');
  $('open-settings').setAttribute('aria-expanded', 'true');
  loadSettings(SET.scene);   // opening reads what is saved again; an earlier draft is not kept
  $('settings').querySelector('select')?.focus();
}
function closeSettings() {
  SET.open = false;
  $('settings').hidden = true;
  $('settings').innerHTML = '';
  document.body.classList.remove('modal-open');
  $('open-settings').setAttribute('aria-expanded', 'false');
  renderScenebar();
  SET.back?.focus?.();
}
function saveSettings() {
  const ch = LocalConfig.changes(SET.draft, SET.saved);
  // The real board sends the version it read and is refused when the saved config moved on.
  if (sScene().changedElsewhere && !SET.reread) { SET.refused = ch.length; renderSettings(); return; }
  SET.saved = copy(SET.draft);
  SET.savedAt = later(1);
  renderSettings();
  toast(`示例：真的 board 在这里把「${ch.map(c => c.text).join('；')}」存进 ${SETTINGS.store}。`);
}
function rereadSettings() {
  const now = sScene().changedElsewhere.saved;
  SET.saved = copy(now); SET.draft = copy(now); SET.scanSource = LocalConfig.source(now);
  SET.refused = 0; SET.reread = true; SET.savedAt = null;
  renderSettings();
  toast('已重新读取：reviewer 现在是 codex · gpt 5.6 sol · xhigh。');
}
// A rescan asks the place the runner on screen points at: Paseo for paseo, the CLIs otherwise.
function rescanSettings() {
  const source = LocalConfig.source(SET.draft);
  SET.scanning = true;
  renderSettings();
  setTimeout(() => {
    if (!SET.open) return;
    SET.scanning = false; SET.scannedAt = later(1); SET.scanSource = source;
    renderSettings();
    toast(source === 'paseo' ? '示例：真的 board 在这里向 Paseo 要每个 host 的 model；这台机器的 Paseo 没开。'
      : '示例：真的 board 在这里重新问一遍每个 host 的 CLI。');
  }, 1400);
}
function settingsKey(e) {
  if (e.key === 'Escape') { e.preventDefault(); closeSettings(); return; }
  if (e.key === 'Tab') {
    const f = [...$('settings').querySelectorAll('button:not([disabled]), select:not([disabled])')];
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    return;
  }
  if (e.target.closest('select')) return;
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
}

$('open-settings').onclick = openSettings;
$('refresh').onclick = () => {
  if (scene().readFailed) { toast(`示例：重读仍然失败，下面还是 ${hhmm(scene().readAt)} 的数据。`); return; }
  S.refreshedAt = NOW;
  renderTop();
  toast('示例：真的 board 在这里立刻重读一次 GitHub；页面开着时它每分钟自己读一次。');
};
$('settings').addEventListener('change', e => {
  const s = e.target.closest('select[data-cell]');
  if (!s) return;
  SET.savedAt = null;
  LocalConfig.setCell(sScan(), SET.draft, s.dataset.key, s.dataset.cell, s.value);
  if (LocalConfig.source(SET.draft) !== SET.scanSource) { rescanSettings(); return; }
  renderSettings();
  $(s.id)?.focus();
});
$('settings').addEventListener('click', e => {
  // A click beside the sheet closes it only when there is nothing to lose.
  if (e.target === $('settings')) { if (!LocalConfig.changes(SET.draft, SET.saved).length) closeSettings(); return; }
  if (e.target.closest('[data-set-close]')) return closeSettings();
  if (e.target.closest('#set-save')) return saveSettings();
  if (e.target.closest('#set-rescan')) return rescanSettings();
  if (e.target.closest('#set-reread')) return rereadSettings();
});

$('legend-beam').innerHTML = beamSVG({ d: 'M2 10 C 16.3 10, 13.7 2, 28 2', ends: [[2, 10], [28, 2]] }, false);
loadScene('morning');
</script>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="stylesheet" href="./styles/tokens.css" />
        <link rel="stylesheet" href="./styles/board.css" />
        <script src="./data/fixtures.js"></script>
        <style>
          body { margin: 0; min-height: 100vh; background: #e6e3df; }
          #dc-root { width: 236px; height: 848px; margin: 0 auto; overflow: hidden; position: relative; transform: translateZ(0); }
          #dc-root > * { height: 100%; }
          .dc-toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 50; padding: 10px 16px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 12px; box-shadow: 0 12px 32px rgba(45, 25, 34, 0.25); }
          .dc-backdrop { position: fixed; inset: 0; background: rgba(40, 25, 32, 0.38); z-index: 40; }
          .dc-modal { position: fixed; inset: 0; margin: auto; height: fit-content; z-index: 41; }
          .sc-host { height: 100%; }
        </style>
      </helmet>
      <nav class="tasks board" data-screen-label="任务" aria-label="任务">
        <div class="col-eyebrow"><span>任务</span><span>{{ v.count }}</span></div>
        <sc-if value="{{ v.empty }}" hint-placeholder-val="{{ false }}"><p class="tasks-empty">没有带 mmw:map label 的票。</p></sc-if>
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
          <button type="button" class="{{ r.cls }}" onClick="{{ r.pick }}">
            <span class="{{ r.lightCls }}" title="{{ r.lightWord }}"></span><span class="task-meta">{{ r.meta }}</span>
            <span class="{{ r.titleCls }}">{{ r.title }}</span>
            <span class="task-progress"><span class="bar"><span class="bar-fill" style="{{ r.barStyle }}"></span></span><span class="task-count">{{ r.count }}</span></span>
          </button>
        </sc-for>
      </nav>
      <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
        <div class="dc-toast" role="status">{{ toast }}</div>
      </sc-if>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{
  "$preview": {
    "width": 236,
    "height": 848
  },
  "scene": {
    "editor": "enum",
    "default": "morning",
    "tsType": "string",
    "options": [
      "morning",
      "twenty-tickets",
      "bad-data",
      "empty"
    ]
  }
}'
    >
      const STATE_SEED = { fx: false, toast: "" };
      function readFx(win, name) {
        return win[name] || {};
      }
      class Component extends DCLogic {
        constructor(props) {
          super(props);
          this.state = Object.assign({}, STATE_SEED, this.init(props));
        }
        componentDidMount() {
          const tick = () => {
            if (window.FIXTURES) { this.setState({ fx: true }, () => this.onReady && this.onReady()); return; }
            this._w = setTimeout(tick, 50);
          };
          tick();
        }
        componentWillUnmount() { clearTimeout(this._w); clearTimeout(this._t); this.cleanup && this.cleanup(); }
        componentDidUpdate(prev) {
          if (prev.scene !== this.props.scene) this.setState(this.init(this.props), () => this.onReady && this.onReady());
          this.afterUpdate && this.afterUpdate(prev);
        }
        toast(msg) {
          this.setState({ toast: msg });
          clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: "" }), 2400);
        }
        emit(name, detail, fallback) {
          if (this.props[name]) this.props[name](detail); else this.toast(fallback);
        }
        fx() { return readFx(window, "FIXTURES"); }
        init(props) {
          const B = window.MMWBoard;
          if (!B) return { task: null };
          const sc = B.scene(props.scene || "morning");
          return { task: sc.select.task != null ? sc.select.task : ((sc.tasks[0] || {}).n ?? null) };
        }
        onReady() { this.setState(this.init(this.props)); }
        afterUpdate(prev) {
          if (this.props.task !== undefined && this.props.task !== prev.task && this.props.task !== this.state.task) this.setState({ task: this.props.task });
        }
        renderVals() {
          const B = window.MMWBoard;
          const task = this.props.task !== undefined ? this.props.task : this.state.task;
          const v = B ? B.taskListView(this.props.scene || "morning", task) : { count: 0, empty: false, rows: [] };
          return {
            toast: this.state.toast, v,
            rows: v.rows.map(r => Object.assign({}, r, {
              pick: () => { this.setState({ task: r.n }); this.emit("onSelectTask", r.n, "→ 画布换成任务 #" + r.n); },
            })),
          };
        }
      }
    </script>
  </body>
</html>

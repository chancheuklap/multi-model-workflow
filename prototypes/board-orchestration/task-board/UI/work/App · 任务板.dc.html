<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="stylesheet" href="./styles/tokens.css" />
        <link rel="stylesheet" href="./styles/board.css" />
        <script src="./data/fixtures.js"></script>
        <style>
          body { margin: 0; min-height: 100vh; background: #e6e3df; }
          html body #dc-root { width: 1440px; height: 900px; margin: 0 auto; overflow: hidden; position: relative; transform: translateZ(0); }
          .app-shell { height: 100%; display: grid; grid-template-rows: 52px minmax(0, 1fr); grid-template-columns: 236px minmax(0, 1fr) 340px; background: var(--panel); }
          .app-top { grid-column: 1 / -1; min-width: 0; }
          .app-slot { min-width: 0; min-height: 0; overflow: hidden; }
          .app-slot > .sc-host, .app-top > .sc-host { height: 100%; }
        </style>
      </helmet>
      <main class="app-shell board" data-screen-label="任务板">
        <div class="app-top"><dc-import name="Component · 顶栏" scene="{{ scene }}" onJumpNeedYou="{{ jump }}" hint-size="100%,52px"></dc-import></div>
        <div class="app-slot"><dc-import name="Component · 任务列表" scene="{{ scene }}" task="{{ task }}" onSelectTask="{{ pickTask }}" hint-size="100%,100%"></dc-import></div>
        <div class="app-slot"><dc-import name="Component · 画布" scene="{{ scene }}" task="{{ task }}" sel="{{ sel }}" onSelectNode="{{ pickNode }}" hint-size="100%,100%"></dc-import></div>
        <div class="app-slot"><dc-import name="Component · 详情" scene="{{ scene }}" sel="{{ sel }}" onGoto="{{ goto }}" onClose="{{ close }}" hint-size="100%,100%"></dc-import></div>
      </main>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{
  "$preview": { "width": 1440, "height": 900 },
  "scene": { "editor": "enum", "default": "morning", "tsType": "string", "options": ["morning", "twenty-tickets", "bad-data", "empty"] }
}'
    >
      // The page holds which task is on the canvas and which card is selected; the four
      // components report clicks, and this page decides what the others show next.
      class Component extends DCLogic {
        constructor(props) {
          super(props);
          this.state = { ready: false, task: null, sel: null };
        }
        componentDidMount() {
          const tick = () => {
            if (window.MMWBoard) { this.reset(); return; }
            this._w = setTimeout(tick, 50);
          };
          tick();
        }
        componentWillUnmount() { clearTimeout(this._w); }
        componentDidUpdate(prev) {
          if (prev.scene !== this.props.scene) this.reset();
        }
        sceneKey() { return this.props.scene || "morning"; }
        reset() {
          const sc = window.MMWBoard.scene(this.sceneKey());
          this.setState({ ready: true, task: sc.select.task != null ? sc.select.task : ((sc.tasks[0] || {}).n ?? null), sel: sc.select.node ?? null });
        }
        renderVals() {
          const B = window.MMWBoard;
          return {
            scene: this.sceneKey(), task: this.state.task, sel: this.state.sel,
            pickTask: n => this.setState({ task: n, sel: null }),
            pickNode: n => this.setState({ sel: n }),
            goto: n => {
              const f = B && B.find(this.sceneKey(), n);
              if (f) this.setState({ task: f.task.n, sel: n });
            },
            close: () => this.setState({ sel: null }),
            jump: () => {
              const next = B && B.nextOrange(this.sceneKey(), this.state.sel);
              if (next) this.setState({ task: next.task, sel: next.node });
            },
          };
        }
      }
    </script>
  </body>
</html>

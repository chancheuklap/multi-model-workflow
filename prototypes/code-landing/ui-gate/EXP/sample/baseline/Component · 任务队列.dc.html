<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="stylesheet" href="./styles/tokens.css" />
        <link rel="stylesheet" href="./styles/product-workbench.css" />
        <script src="./data/fixtures.js"></script>
        <style>
          body { margin: 0; min-height: 100vh; background: #e6e3df; }
          #dc-root { width: 1440px; height: 900px; margin: 0 auto; overflow: hidden; position: relative; transform: translateZ(0); }
          #dc-root > * { height: 100%; }
          .dc-toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 50; padding: 10px 16px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 12px; box-shadow: 0 12px 32px rgba(45, 25, 34, 0.25); }
          .dc-backdrop { position: fixed; inset: 0; background: rgba(40, 25, 32, 0.38); z-index: 40; }
          .dc-modal { position: fixed; inset: 0; margin: auto; height: fit-content; z-index: 41; }
          .wb-queue { height: 100%; display: grid; grid-template-columns: 292px minmax(0, 1fr); background: var(--canvas); }
          .wb-queue-rest { background: var(--surface); }
          .draft-replace-dialog.dc-modal { display: block; }
        </style>
      </helmet>
      <div class="wb-queue" data-screen-label="任务队列">
        <aside class="project-queue" aria-label="商品任务队列">
          <div class="panel-title"><h2 class="panel-title-h2">商品任务队列</h2><span class="panel-title-span">{{ count }} 个任务</span></div>
          <div class="queue-note">当前任务和历史任务都保存在这里。未使用参考图的已交付图片可以继续生成。</div>
          <button type="button" class="new-project" disabled="{{ serviceDown }}" onClick="{{ newTask }}"><span class="new-project-mark" aria-hidden="true">＋</span><span><b class="new-project-b">新建生成任务</b><small class="new-project-small">为各功能图片选择商品主体图</small></span></button>
          <div class="queue-list">
            <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div class="queue-empty">还没有生成任务</div></sc-if>
            <sc-for list="{{ tasks }}" as="t" hint-placeholder-count="3">
              <button type="button" class="{{ t.cls }}" onClick="{{ t.pick }}"><div class="{{ t.thumbCls }}" aria-hidden="true"></div><span class="item-copy"><span class="item-name">{{ t.name }}</span><span class="item-id">{{ t.meta }}</span><span class="{{ t.stateCls }}">{{ t.stateText }}</span></span></button>
            </sc-for>
          </div>
          <div class="queue-foot">任务按最新时间排列。选择任务，可以查看每张已交付图片。</div>
        </aside>
        <div class="wb-queue-rest"></div>
        <sc-if value="{{ replace }}" hint-placeholder-val="{{ false }}">
          <div class="dc-backdrop" onClick="{{ keepDraft }}"></div>
          <div class="draft-replace-dialog dc-modal" role="dialog" aria-modal="true" data-screen-label="放弃当前设置">
            <div class="draft-replace-shell">
              <header class="draft-replace-head"><h2 class="draft-replace-head-h2">放弃当前设置并新建？</h2><p class="draft-replace-head-p">当前未提交的设置会被删除。</p></header>
              <footer class="draft-replace-foot"><button class="btn" type="button" onClick="{{ keepDraft }}">保留当前设置</button><button class="btn danger" type="button" onClick="{{ discardDraft }}">放弃并新建</button></footer>
            </div>
          </div>
        </sc-if>
      </div>
      <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
        <div class="dc-toast" role="status">{{ toast }}</div>
      </sc-if>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{
  "$preview": {
    "width": 1440,
    "height": 900
  },
  "scenario": {
    "editor": "enum",
    "default": "default",
    "tsType": "string",
    "options": [
      "default",
      "queue-empty",
      "task-selected",
      "library-draft-replace",
      "billing-debt-gate",
      "service-down"
    ]
  },
  "selectedTaskId": {
    "editor": "text",
    "default": "",
    "tsType": "string"
  }
}'
    >
      class Component extends DCLogic {
        constructor(props) {
          super(props);
          this.state = Object.assign({ fx: false, toast: "" }, this.init(props));
        }
        componentDidMount() {
          const tick = () => {
            if (window.CHAMELEON) { this.setState({ fx: true }, () => this.onReady && this.onReady()); return; }
            this._w = setTimeout(tick, 50);
          };
          tick();
        }
        componentWillUnmount() { clearTimeout(this._w); clearTimeout(this._t); this.cleanup && this.cleanup(); }
        componentDidUpdate(prev) {
          if (prev.scenario !== this.props.scenario) this.setState(this.init(this.props), () => this.onReady && this.onReady());
          this.afterUpdate && this.afterUpdate(prev);
        }
        toast(msg) {
          this.setState({ toast: msg });
          clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: "" }), 2400);
        }
        emit(name, detail, fallback) {
          if (this.props[name]) this.props[name](detail); else this.toast(fallback);
        }
        fx() { return window.CHAMELEON || {}; }
        init(props) {
          const sc = props.scenario || "default";
          return { scenario: sc, selected: props.selectedTaskId || (sc === "task-selected" ? "running-main" : ""), replace: sc === "library-draft-replace" };
        }
        onReady() { this.setState(this.init(this.props)); }
        afterUpdate(prev) { if (prev.selectedTaskId !== this.props.selectedTaskId) this.setState({ selected: this.props.selectedTaskId || "" }); }
        renderVals() {
          const wb = this.fx().wb; const st = this.state; const serviceDown = st.scenario === "service-down";
          const base = wb && st.scenario !== "queue-empty" ? (this.props.extraTasks || []).concat(wb.tasks(wb.projects[0], this.props.failedKind)) : [];
          const tasks = base.map(t => ({ name: t.name, meta: t.meta, stateText: t.stateText, cls: "queue-item" + (st.selected === t.taskId ? " current" : ""), thumbCls: "product-thumb " + t.thumb, stateCls: "item-state " + t.state,
            pick: () => { this.setState({ selected: t.taskId }); this.emit("onSelectTask", t, "→ 打开任务详情：" + t.meta); } }));
          const hasDraft = Boolean(this.props.hasDraft);
          return { toast: st.toast, count: tasks.length, tasks, empty: tasks.length === 0, serviceDown, replace: st.replace,
            newTask: () => { if (st.scenario === "billing-debt-gate") { this.emit("onBillingDebt", null, "→ 弹出欠费门禁"); return; } if (hasDraft || st.scenario === "library-draft-replace") { this.setState({ replace: true }); return; } this.setState({ selected: "" }); this.emit("onNewTask", null, "→ 新建生成任务（设置面板重置）"); },
            keepDraft: () => this.setState({ replace: false }),
            discardDraft: () => { this.setState({ replace: false, selected: "" }); this.emit("onNewTask", { discarded: true }, "→ 放弃当前设置并新建"); } };
        }
      }
    </script>
  </body>
</html>

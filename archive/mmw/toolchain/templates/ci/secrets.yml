name: mmw-secrets

# 由 mmw toolchain apply 产出，MMW 拥有这份文件。改判据要改 MMW 的模板
# （toolchain/templates/ci/secrets.yml）——只改这一份，换个仓库就没有了，而且下一次
# apply 会把它盖回去。
#
# 每次 push / PR 必跑的廉价安全门：扫明文密钥。纯 grep，秒级，零依赖，所以整仓扫，
# 不做增量——密钥泄漏没有"存量可以先欠着"这一说。
#
# 只扫 git 跟踪的文件：gitignore 掉的本地 .env 没提交，不算泄漏。加密文件（*.age、
# *.gpg、*.enc）显式排除——二进制内容不会命中，仍排掉省时间。
#
# 模式清单来自 MMW 规则表的 secrets 规则，由 apply 填进下面那个数组。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmw-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: mmw-secrets-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for plaintext secrets
        shell: bash
        run: |
          set -uo pipefail
          patterns=(
__PATTERNS__
          )
          found=0
          for p in "${patterns[@]}"; do
            # -e 不能省：私钥那条模式以 - 开头，不加 -e 会被当成命令行选项，git grep
            # 报 unknown option 然后那一整类静默漏掉——门禁看着在跑，其实少扫一种。
            if git grep -InE -e "$p" -- ':!*.age' ':!*.gpg' ':!*.enc'; then
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then
            echo "FAIL: 发现明文密钥（见上）。撤销那个凭证，再把它从提交历史里清掉。" >&2
            exit 1
          fi
          echo "通过：没有命中任何明文密钥模式。"

<title>MMW 分层布置图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Layout: one reading column (max 1180px) with full-bleed figure panels; every section opens with a figure, then 1-3 sentences, then tables. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eef1f6; --ink:#17202c; --ink2:#3a4656; --muted:#5d6878; --line:#d5dbe4; --line2:#aeb8c6;
  --c-mode:#2a78d6; --c-pb:#eb6834; --c-cap:#1baf7a; --c-ref:#eda100; --c-pr:#e87ba4; --c-sc:#4a3aa7; --c-cfg:#008300; --c-nt:#8a95a5;
  --risk:#c8322b; --warn:#b77700; --ok:#2f7d4f;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-head:"Noto Serif SC","Songti SC","STSong",serif;
  --f-mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#161d27; --surface2:#1c2531; --ink:#e6ebf2; --ink2:#c3ccd8; --muted:#97a3b3; --line:#2c3746; --line2:#4a586b;
  --c-mode:#3987e5; --c-pb:#d95926; --c-cap:#199e70; --c-ref:#c98500; --c-pr:#d55181; --c-sc:#9085e9; --c-cfg:#2f9e2f; --c-nt:#7d8898;
  --risk:#ef6a62; --warn:#e0a53a; --ok:#58b07c; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#161d27; --surface2:#1c2531; --ink:#e6ebf2; --ink2:#c3ccd8; --muted:#97a3b3; --line:#2c3746; --line2:#4a586b;
  --c-mode:#3987e5; --c-pb:#d95926; --c-cap:#199e70; --c-ref:#c98500; --c-pr:#d55181; --c-sc:#9085e9; --c-cfg:#2f9e2f; --c-nt:#7d8898;
  --risk:#ef6a62; --warn:#e0a53a; --ok:#58b07c; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;margin:0}
.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;line-height:1.3;color:var(--ink)}
h1{font-size:clamp(28px,4.2vw,40px);margin:0 0 6px}
h2{font-size:clamp(21px,2.6vw,26px);margin:48px 0 12px;padding-top:14px;border-top:1px solid var(--line)}
h3{font-size:17px;margin:26px 0 8px}
p{margin:8px 0;max-width:72ch}
code,span.mono{font-family:var(--f-mono);font-size:.88em;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
.sub{color:var(--muted);font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start;margin-top:10px}
.hero>*{min-width:0}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.claims{display:grid;gap:6px;margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.6}
.claims li{margin:0}
.lead{font-size:14px;line-height:1.6;max-width:none;margin:6px 0 10px;color:var(--ink2)}
.lead b{color:var(--ink)}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0}
@media (max-width:700px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}.num .l{display:block;font-size:13px}}
.num{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
.num .v{font-family:var(--f-head);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.num .l{font-weight:600;font-size:14px}
.num .d{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:2px}
.num .v{line-height:1.2}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.fact{background:var(--surface2);border-radius:6px;padding:6px 10px;font-size:13px;min-width:0}
.fact b{font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;margin:10px 0 0;padding:7px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:14px;border-radius:3px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.sw.ps{border-style:dashed}
.k-mode{--c:var(--c-mode)}.k-pb{--c:var(--c-pb)}.k-cap{--c:var(--c-cap)}.k-ref{--c:var(--c-ref)}.k-pr{--c:var(--c-pr)}.k-sc{--c:var(--c-sc)}.k-cfg{--c:var(--c-cfg)}.k-nt{--c:var(--c-nt)}
figure{margin:18px 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.diagram{overflow-x:auto;-webkit-overflow-scrolling:touch}
.diagram svg{display:block;width:100%;height:auto}
figcaption{font-size:13.5px;color:var(--ink2);margin-top:10px;line-height:1.55}
figcaption b{color:var(--ink)}
.hint{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto;margin:10px 0 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.5}
th,td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line);min-width:90px}
th{background:var(--surface2);font-weight:600;color:var(--ink2);position:sticky;top:0}
td.src,th.src{color:var(--muted);font-size:11.5px;white-space:normal;width:140px;min-width:120px}
table.fixed{table-layout:fixed}
table.fixed td,table.fixed th{min-width:0;overflow-wrap:anywhere}
td .ln{display:block;padding-left:1em;text-indent:-1em}
.subfig{font-family:var(--f-head);font-weight:700;font-size:14px;margin:14px 0 4px;color:var(--ink)}
.swipe{display:none;font-size:12px;color:var(--muted);text-align:center;margin:0 0 4px}
@media (max-width:700px){.swipe{display:block}}
tr:last-child td{border-bottom:0}
details{margin:8px 0 14px}
summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--ink2)}
summary:focus-visible{outline:2px solid var(--c-mode);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:12px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.card h4{margin:2px 0 6px;font-size:15px;font-family:var(--f-head)}
.card p{font-size:13.5px;margin:6px 0}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--ink2);margin-right:6px}
.pill.risk{border-color:var(--risk);color:var(--risk)}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.card.risk{border-left:3px solid var(--risk)}
.card.pending{border-left:3px solid var(--warn)}
ul.tight{margin:6px 0;padding-left:20px;font-size:14px}
ul.tight li{margin:3px 0}
.srcnote{color:var(--muted);font-size:11.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.grid2>*{min-width:0}
#tip{position:fixed;z-index:50;max-width:min(420px,90vw);background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.5;padding:8px 10px;border-radius:6px;white-space:pre-line;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.25)}
/* svg */
svg text{font-family:var(--f-body);fill:var(--ink)}
svg .mono{font-family:var(--f-mono);font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
svg text.lbl{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
svg .tm{fill:var(--muted)}
svg .t2{fill:var(--ink2)}
svg .b{font-weight:600}
svg .hd{font-family:var(--f-head);font-weight:700}
svg rect.bx{fill:color-mix(in srgb,var(--c) 15%,var(--surface));stroke:var(--c);stroke-width:1.5}
svg rect.bx.soft{fill:color-mix(in srgb,var(--c) 7%,var(--surface));stroke-width:1.2}
svg rect.bx.ps,svg rect.bx.dash{stroke-dasharray:5 3}
svg rect.bx.dim{opacity:.55}
svg rect.grp{fill:var(--surface2);stroke:var(--line2);stroke-width:1}
svg rect.grp.dash{stroke-dasharray:6 4;fill:none}
svg rect.tagbg{fill:color-mix(in srgb,var(--c) 40%,var(--surface));stroke:none}
svg rect.lbg{fill:var(--surface);opacity:.93}
svg .lane{stroke:var(--line2);stroke-width:1;stroke-dasharray:3 4}
svg .sep{stroke:var(--line);stroke-width:1}
svg path.e{fill:none;stroke-width:1.5}
svg .e-route{stroke:var(--c-mode)} svg .mk-route{fill:var(--c-mode)}
svg .e-call{stroke:var(--c-cap)} svg .mk-call{fill:var(--c-cap)}
svg .e-run{stroke:var(--c-sc)} svg .mk-run{fill:var(--c-sc)}
svg .e-events{stroke:var(--ink2)} svg .mk-events{fill:var(--ink2)}
svg .e-cite{stroke:var(--c-pr);stroke-dasharray:6 4} svg .mk-cite{fill:var(--c-pr)}
svg .e-install{stroke:var(--muted)} svg .mk-install{fill:var(--muted)}
svg .e-wake{stroke:var(--c-pb);stroke-dasharray:9 3 2 3} svg .mk-wake{fill:var(--c-pb)}
svg .e-config{stroke:var(--c-cfg)} svg .mk-config{fill:var(--c-cfg)}
svg .e-check{stroke:var(--muted);stroke-dasharray:3 3} svg .mk-check{fill:var(--muted)}
svg .e-say{stroke:var(--ink)} svg .mk-say{fill:var(--ink)} svg path.e.e-say{stroke-width:2.2}
svg .e-evt{stroke:var(--ink2)} svg .mk-evt{fill:var(--ink2)} svg .mk-evt-o{fill:var(--surface);stroke:var(--ink2);stroke-width:1.6}
svg .e-deny{stroke:var(--c-sc);stroke-dasharray:2.5 2.5} svg .mk-deny{fill:var(--c-sc)} svg path.e.e-deny{stroke-width:2}
svg .e-prompt{stroke:var(--c-mode)} svg .mk-prompt{fill:var(--c-mode)}
svg .e-read{stroke:var(--c-ref)} svg .mk-read{fill:var(--c-ref)}
svg .e-refusal{stroke:var(--risk)} svg .mk-refusal{fill:var(--risk)}
svg .e-return{stroke:var(--muted)} svg .mk-return{fill:var(--muted)}
svg .e-user{stroke:var(--ink2);stroke-dasharray:2 3} svg .mk-user{fill:var(--ink2)}
svg path.halo{fill:none;stroke:var(--surface);stroke-width:6;stroke-linejoin:round}
svg path.e.later{stroke-dasharray:6 3}
svg g.flow path.hl{opacity:0}
svg g.flow:hover path.hl{opacity:1;stroke-width:2}
svg g.band path.bandp{fill:color-mix(in srgb,var(--c) 42%,transparent);stroke:var(--c);stroke-width:.6}
svg g.band:hover path.bandp{fill:color-mix(in srgb,var(--c) 75%,transparent)}
svg [data-tip]{cursor:help}
svg .dot{fill:var(--c)} svg .dotb{fill:none;stroke:var(--c);stroke-width:1.4;stroke-dasharray:2 2}
svg .risk{fill:var(--risk)} svg .warn{fill:var(--warn)}
svg rect.cellbg{fill:var(--surface2)}
svg rect.hl{fill:color-mix(in srgb,var(--c-pb) 10%,var(--surface));stroke:var(--c-pb);stroke-width:1.5}
@media (max-width:640px){body{font-size:14.5px} h2{margin-top:40px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
#s1>h2{margin-top:14px}
.elegend{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;font-size:12px;color:var(--ink2);margin:10px 0 0;padding:6px 2px 0;border-top:1px dashed var(--line)}
.elegend .it{display:inline-flex;align-items:center;gap:6px;min-width:0}
.elegend svg{flex:none;overflow:visible}
.elegend .nm{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.2px solid var(--ink2);background:var(--surface);font-weight:600;font-size:11px;flex:none}
.elegend .tagx{display:inline-block;font-size:10.5px;padding:0 6px;border:1.2px dashed var(--c-sc);border-radius:8px;background:color-mix(in srgb,var(--c-sc) 8%,var(--surface))}
.elegend .dotx{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
</style>

    trigger: {role: button, name: "立刻重读 GitHub"}
    precondition: {last_read: "ok"}
    scenes: ["任务板.morning", "任务板.twenty-tickets", "任务板.empty", "顶栏.morning", "顶栏.twenty-tickets", "顶栏.empty"]
    calls: ["POST /api/board/refresh"]
    shows: {read_time: "read_at@POST /api/board/refresh", board: "tasks@POST /api/board/refresh"}
    next: "stay"
    on_failure: {github_read_failed: "顶栏.bad-data", board_unreachable: "stay; the read time keeps its old value"}
    source: ["#318 Implementation Decisions 11", "#318 Implementation Decisions 4"]
    gap: aligned
  - id: topbar.refresh-after-failure
    component: "顶栏"
    trigger: {role: button, name: "立刻重读 GitHub"}
    precondition: {last_read: "failed"}
    scenes: ["任务板.bad-data", "顶栏.bad-data"]
    calls: ["POST /api/board/refresh"]
    shows: {read_time: "read_at@POST /api/board/refresh", read_failed: "read_failed@POST /api/board/refresh"}

  # sends the version it read; the board refuses a stale version, validates by start's rules, takes the lock, replaces the file whole (§16)
  - id: settings.save
    component: "本机配置"
    trigger: {role: button, name: "保存"}
    precondition: {draft: "changed", flagged_cells: "none", scan: "done", refused: "no"}
    scenes: ["edited"]
    calls: ["PUT /api/settings"]
    shows: {version: "version@PUT /api/settings", saved_at: "saved_at@PUT /api/settings", changes: "changes(draft, saved)@GET /api/settings"}
    next: "saved"
    on_failure: {version_conflict: "refused", invalid_value: "stay; each cell the board names is flagged with its reason", forbidden_origin_or_token: "stay; nothing is written", lock_held: "stay; nothing is written"}
    source: ["#318 Implementation Decisions 16", "#318 Implementation Decisions 15", "#318 Implementation Decisions 14"]
    gap: aligned

rows:
  # jumps to the next orange ticket after the selected one, opens its spec, selects it (the name embeds the count; one row per count the handoff shows)
  - id: topbar.jump-need-you-3
    component: "顶栏"
    trigger: {role: button, name: "needs you 3"}
    precondition: {orange_tickets: "some"}
    scenes: ["任务板.morning", "顶栏.morning"]
    calls: ["none"]
    shows: {count: "count(lamp(tickets[].fold)=orange)@GET /api/board"}
    next: "ticket-bounced"
    source: ["#318 Implementation Decisions 4", "#318 Implementation Decisions 3"]
    gap: aligned
  # jumps to the next orange ticket after the selected one, opens its spec, selects it (the name embeds the count; one row per count the handoff shows)
  - id: topbar.jump-need-you-2

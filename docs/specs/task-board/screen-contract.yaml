readme_dispositions: []   # the package has no README.md: the Claude Design project holds none
backend_without_ui:
  - "GET /api/board on page load and every 60 s while the page is open and in the foreground tab — no control; the top bar's read time shows it (#318 Implementation Decisions 11)"
  - "board process: whole-tree GraphQL read (tree.py plus labels and blockedBy) every 10 minutes and at once after child.opened or a became-ticket child.closed — no control (#318 Implementation Decisions 11)"
  - "board process: comment reads of unlanded tickets with ETag, 304 not counted against the quota — no control (#318 Implementation Decisions 11)"
  - "board process: one host scan at start-up, held in memory with its time, never written to a file — no control; the sheet shows its result (#318 Implementation Decisions 13)"
  - "board process: binds 127.0.0.1, checks Host and Origin, a per-start token on every write — no control; a refused write is settings.save's on_failure (#318 Implementation Decisions 16)"
  - "models.py write function and the dispatch skill's command-line entry that changes one role or the runner — no-ui: an agent's command, not the page (#318 Implementation Decisions 16)"
  - "start reads models.json on every session start; running sessions keep their configuration — no-ui: dispatch.sh (#318 Implementation Decisions 15)"
  - "switch-over: models.md imported as version 1 and removed; install.sh writes initial values on a new machine — no-ui (#318 Implementation Decisions 17)"
  - "start attaches the worktree to its ticket through the runner adapter (orca worktree set --issue) — no-ui: shows in the runner's own sidebar, not on this page (#318 Implementation Decisions 9)"
  - "the runner's Workspace Board sync switch stays off — no-ui: a rule for people and scripts (#318 Implementation Decisions 9)"
  - "regression, advisor consultations and the watchdog's unknown answer are not shown — no-ui by decision (#318 Implementation Decisions 10)"
  - "the board never writes a ticket and takes no part in wakes — no-ui: nothing on the page may call GitHub with a write (#318 Implementation Decisions 8)"
  - "the page is served on localhost and may be opened in the runner's built-in browser tab — no-ui (#318 Implementation Decisions 1)"
proposed_operations:
  - "GET /api/board"
  - "POST /api/board/refresh"
  - "GET /api/settings"
  - "PUT /api/settings"
  - "POST /api/settings/scan"

    calls: ["none"]
    shows: {count: "count(lamp(tickets[].fold)=orange)@GET /api/board"}
    next: "详情.twenty-tickets"
    source: ["#318 Implementation Decisions 4", "#318 Implementation Decisions 3"]
    gap: aligned
  # jumps to the next orange ticket after the selected one, opens its spec, selects it (the name embeds the count; one row per count the handoff shows)
  - id: topbar.jump-need-you-1
    component: "顶栏"
    trigger: {role: button, name: "needs you 1"}
    precondition: {orange_tickets: "some"}
    scenes: ["任务板.bad-data", "顶栏.bad-data"]
    calls: ["none"]
    shows: {count: "count(lamp(tickets[].fold)=orange)@GET /api/board"}
    next: "ticket-fault"
    source: ["#318 Implementation Decisions 4", "#318 Implementation Decisions 3"]
    gap: aligned
  # disabled: no ticket has an orange lamp, so there is nothing to jump to
  - id: topbar.need-you-none
    component: "顶栏"
    trigger: {role: button, name: "needs you 0"}
    precondition: {orange_tickets: "none"}
    scenes: ["任务板.empty", "顶栏.empty"]
    calls: ["none"]
    shows: {count: "count(lamp(tickets[].fold)=orange)@GET /api/board"}
    next: "stay"
    source: ["#318 Implementation Decisions 4"]
    gap: aligned
  # reads GitHub now over §11's scope; the page also polls GET /api/board every 60 s while it is open and visible
  - id: topbar.refresh
    component: "顶栏"
    trigger: {role: button, name: "立刻重读 GitHub"}
    precondition: {last_read: "ok"}
    scenes: ["任务板.morning", "任务板.twenty-tickets", "任务板.empty", "顶栏.morning", "顶栏.twenty-tickets", "顶栏.empty"]
    calls: ["POST /api/board/refresh"]
    shows: {read_time: "read_at@POST /api/board/refresh", board: "tasks@POST /api/board/refresh"}
    next: "stay"
    on_failure: {github_read_failed: "顶栏.bad-data", board_unreachable: "stay; the read time keeps its old value"}
    source: ["#318 Implementation Decisions 11", "#318 Implementation Decisions 4"]
    gap: aligned
  - id: topbar.refresh-after-failure
    component: "顶栏"
    trigger: {role: button, name: "立刻重读 GitHub"}
    precondition: {last_read: "failed"}
    scenes: ["任务板.bad-data", "顶栏.bad-data"]
    calls: ["POST /api/board/refresh"]
    shows: {read_time: "read_at@POST /api/board/refresh", read_failed: "read_failed@POST /api/board/refresh"}
    next: "顶栏.morning"
    on_failure: {github_read_failed: "顶栏.bad-data", board_unreachable: "stay"}
    source: ["#318 Implementation Decisions 11", "#318 Implementation Decisions 4"]
    gap: aligned
  # every opening reads the saved configuration afresh; unsaved edits from the last opening are dropped (§14)
  - id: topbar.open-settings
    component: "顶栏"
    trigger: {role: button, name: "本机配置"}
    precondition: {}
    scenes: ["任务板.morning", "任务板.twenty-tickets", "任务板.bad-data", "任务板.empty", "顶栏.morning", "顶栏.twenty-tickets", "顶栏.bad-data", "顶栏.empty"]
    calls: ["GET /api/settings"]
    shows: {sheet: "version, runner, rows, scan@GET /api/settings"}
    next: "mine"
    on_failure: {settings_read_failed: "stay; the sheet does not open"}
    source: ["#318 Implementation Decisions 14", "#318 Implementation Decisions 12"]
    gap: aligned
  # puts this task's tree on the canvas; nothing is fetched
  - id: tasks.pick-77
    component: "任务列表"
    trigger: {role: button, name: "done #77 · grilling 交接包比对 3/3 landed"}
    precondition: {lamp: "done"}
    scenes: ["任务板.morning", "任务列表.morning"]
    calls: ["none"]
    shows: {lamp: "aggregate_lamp(task.specs[].tickets[].fold)@GET /api/board", number: "task.number@GET /api/board", kind: "task.kind@GET /api/board", title: "task.title@GET /api/board", progress: "count(landed)/count(tickets)@GET /api/board"}
    next: "canvas.fit"
    source: ["#318 Implementation Decisions 3", "#318 Implementation Decisions 4"]
    gap: aligned

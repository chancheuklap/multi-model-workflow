backend_without_ui:
- 'GET /api/board — no control: the page reads it once when it opens and every 60 s while it is in the foreground (#544, #552); every shows@GET /api/board value comes from it'
- 'no-ui: the board never writes a ticket and binds 127.0.0.1 only; writes are gated on Host, Origin and the per-start page token (#543) — every write row''s on_failure carries gate_403'
- 'no-ui: ticket.regressed, advisor consultations and a liveness answer of don''t-know are never shown; Orca''s Workspace Board is not a source (#545)'
- 'no-ui: the board scans the hosts once at start and keeps the result in process memory with its time (#550); the sheet shows it through scan@GET /api/settings'
- 'no-ui: PUT /api/settings answering 423 (lock held elsewhere) gets no interface state — conversation 2026-09-21: 本机只有一个人写配置，锁冲突不会发生，不为它设计提示'
- 'no-ui: models.json lives at MMW_HOME/models.json, shape {version, runner, rows}; defaults are written only on first install (#549)'
rows:
- id: topbar.refresh
  component: mmw-v2/board/page/topbar.mjs
  trigger: 顶栏.refresh
  precondition: {}
  scenes:
  - Component · 顶栏.morning
  - Component · 顶栏.twenty-tickets
  - Component · 顶栏.bad-data
  - Component · 顶栏.empty
  calls:
  - POST /api/board/refresh
  shows:
    needs_you_count: tasks[].specs[].tickets[].fold@POST /api/board/refresh → count of lamp orange
    running_count: tasks[].specs[].tickets[].fold@POST /api/board/refresh → count of lamp green
    waiting_sub: tasks[].specs[].tickets[].fold@POST /api/board/refresh → count of phase waiting
    queued_count: tasks[].specs[].tickets[].fold@POST /api/board/refresh → count of lamp hollow
    done_count: tasks[].specs[].tickets[].fold@POST /api/board/refresh → count of lamp ink
    read_time: read_at@POST /api/board/refresh
  next: Component · 顶栏.morning
  on_failure:
    github_read_failed: Component · 顶栏.bad-data — 200 with read_failed; the last good data stays and the read-state line names its time and age
    gate_403: stay — gates.py answers 403 and nothing changes; the page shows no message
  source:
  - '#544 — 顶栏读取时间旁边有刷新按钮，立刻按同一范围读一次'
  - '#552 — POST /api/board/refresh 顶栏刷新按钮，形状同 GET /api/board'
  gap: aligned
- id: topbar.needs-you-none
  component: mmw-v2/board/page/topbar.mjs
  trigger: 顶栏.needs-you
  precondition:
    needs_you: none
  scenes:
  - Component · 顶栏.empty
  calls:
  - none
  shows:
    needs_you_count: tasks[].specs[].tickets[].fold@GET /api/board → count of lamp orange
  next: stay
  source:
  - '#547 — 顶栏是四盏灯各自的计数；需要你可点，跳到下一张橙灯的票'
  gap: aligned
- id: topbar.needs-you-jump
  component: mmw-v2/board/page/topbar.mjs
  trigger: 顶栏.needs-you
  precondition:
    needs_you: some
  scenes:
  - Component · 顶栏.morning
  - Component · 顶栏.twenty-tickets
  - Component · 顶栏.bad-data
  calls:
  - none
  shows:
    needs_you_count: tasks[].specs[].tickets[].fold@GET /api/board → count of lamp orange
  next: Component · 详情.ticket-returned
  source:
  - '#547 — 需要你可点，跳到下一张橙灯的票'
  gap: aligned
- id: topbar.open-settings
  component: mmw-v2/board/page/topbar.mjs
  trigger: 顶栏.settings
  precondition: {}
  scenes:
  - Component · 顶栏.morning
  - Component · 顶栏.twenty-tickets
  - Component · 顶栏.bad-data
  - Component · 顶栏.empty
  calls:
  - GET /api/settings
  shows:
    config: version, runner, rows@GET /api/settings
    options: hosts, runners, sources@GET /api/settings
    scan: scan.source, scan.scanned_at, scan.scanning, scan.hosts@GET /api/settings
  next: Component · 本机配置.mine
  on_failure:
    config_missing_503: stay — the sheet does not open; the page shows no message (code:mmw-v2/board/page/topbar.mjs notify)
  source:
  - '#551 — 入口是顶栏最右端的齿轮，点开是一个居中弹窗；每次打开都重新读一次保存着的配置'
  - '#552 — GET /api/settings 打开本机配置'
  gap: aligned
- id: tasks.pick
  component: mmw-v2/board/page/tasks.mjs
  trigger: 任务列表.task
  precondition: {}
  scenes:
  - Component · 任务列表.morning
  - Component · 任务列表.twenty-tickets
  - Component · 任务列表.bad-data
  calls:
  - none
  shows:
    meta: tasks[].n, tasks[].kind@GET /api/board
    title: tasks[].title@GET /api/board
    lamp: tasks[].specs[].tickets[].fold@GET /api/board → container lamp over all its tickets (page computes)
    progress: tasks[].specs[].tickets[].fold, tasks[].specs[].tickets[].blocker_hold@GET /api/board → landed / total (page computes)
  next: Component · 任务列表.morning
  source:
  - '#318 Implementation Decisions 4 — 左栏任务卡的灯按同一条规则取整个任务'
  - '#547 — 容器的灯取它下面全部 ticket 的灯'
  gap: aligned

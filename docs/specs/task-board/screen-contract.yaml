  - App · 任务板.bad-data
  calls:
  - none
  shows:
    title: tasks[].specs[].tickets[].title@GET /api/board
    origin: tasks[].specs[].tickets[].closeout, tasks[].specs[].n, tasks[].n@GET /api/board
    status: tasks[].specs[].tickets[].fold, tasks[].specs[].tickets[].events@GET /api/board → lamp, status word, phase, elapsed (page computes)
    runtime: tasks[].specs[].tickets[].events@GET /api/board → payload of the latest worker.started and ticket.checked slot
    why: tasks[].specs[].tickets[].fold@GET /api/board → open decision / fault / contract children, handback, bounce reason
    blockers: tasks[].specs[].tickets[].blockers[]@GET /api/board
    events: tasks[].specs[].tickets[].events@GET /api/board → blocks by step (page computes)
    sub_issues: tasks[].specs[].tickets[].fold@GET /api/board → children with kind and resolution
  next: Component · 详情.morning
  source:
  - '#548 — 整张卡片是一个按钮，点它就选中并在右栏打开'
  gap: aligned

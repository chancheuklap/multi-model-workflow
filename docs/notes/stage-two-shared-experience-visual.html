<svg viewBox="0 0 1280 7376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mmw-memory-flow-title mmw-memory-flow-desc"><title id="mmw-memory-flow-title">MMW 阶段二与阶段三共享经验完整流程</title><desc id="mmw-memory-flow-desc">竖版流程图。MMW 先在 repository Space 内通过 native parent graph 把 ticket 解析为 map 或 standalone spec 的 task root。worker 启动时取得同一 task 的共享经验和与新 task 相关的历史经验，运行中按明确问题主动搜索并当场写入可复用经验；必须立即改变行为的信息仍走 tracker event。reviewer 只由 MMW 注入 active Rules 并独立核对。closing pass 逐条处理本 spec 的 worker Memory 并写 spec.closed。随后每份 spec 单独执行 retro，以 event 和 commit 为事实、以较早 Retro Memory 发现同因历史；达到门槛时创建或复用 needs-triage proposal，再写完整 Retro Memory 和 spec.retroed 回执。owner 批准后，内容按性质留在 repository Memory、复制到 mmw-toolbox，或进入 check、script、AGENTS.md、repository-local skill、reviewer active Rule 或 MMW skill。下一项任务从对应入口取得结果。</desc><defs><marker id="mmw-memory-flow-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#4f5d75"/></marker><marker id="mmw-memory-flow-arrow-link" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#2e5aa8"/></marker><marker id="mmw-memory-flow-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#eb6c36"/></marker><marker id="mmw-memory-flow-arrow-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polyline points="0,0 10,4 0,8" fill="none" stroke="#4f5d75" stroke-width="1.5"/></marker></defs>
